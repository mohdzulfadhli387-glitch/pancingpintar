<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a2c">
  <meta name="description" content="Pancing Pintar: cuaca rasmi, rujukan pasang surut, kawasan memancing dan panduan setup.">
  <title>Pancing Pintar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root{color-scheme:dark;--bg:#071a2c;--panel:#10283b;--line:#29465a;--text:#eef7ff;--muted:#a9bfce;--blue:#43b9ff;--teal:#55ddc4;--gold:#ffcf70;--red:#ff7f87;--green:#73dfa0}
    *{box-sizing:border-box}body{margin:0 auto;max-width:640px;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% -10%,#164565 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 14px}.brand{font-size:1.2rem;font-weight:850}.brand small{display:block;color:var(--muted);font-size:.75rem;font-weight:500}.live-state{font-size:.7rem;color:var(--gold);border:1px solid #6b5836;border-radius:20px;padding:5px 9px;white-space:nowrap}
    .card{background:linear-gradient(145deg,rgba(17,42,60,.97),rgba(12,32,49,.97));border:1px solid var(--line);border-radius:18px;padding:15px;margin:0 0 12px;box-shadow:0 9px 22px #0002}.card h2,.card h3{margin:0 0 6px;font-size:1rem}.muted{color:var(--muted);font-size:.82rem}.tiny{color:var(--muted);font-size:.73rem}.control{display:grid;gap:7px;margin-bottom:10px}.label{display:block;color:var(--muted);font-size:.78rem}select,input{font:inherit;color:var(--text);background:#0b2031;border:1px solid var(--line);border-radius:12px;padding:11px;width:100%;outline:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.tab{border:1px solid var(--line);border-radius:12px;background:#10283b;color:var(--muted);padding:9px 4px;font-weight:750;font-size:.73rem;cursor:pointer}.tab.active{color:var(--text);border-color:#3286b3;background:linear-gradient(135deg,#164366,#14534f)}.content{min-height:180px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-block;border:1px solid #41647a;border-radius:99px;padding:4px 9px;color:#b8e4f7;font-size:.7rem;white-space:nowrap}.callout{border-left:3px solid var(--gold);padding:9px 11px;background:#211e18;border-radius:0 10px 10px 0;color:#ffe1a3;font-size:.8rem;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.metric{border:1px solid var(--line);background:#0c2132;border-radius:12px;padding:11px}.metric b{display:block;font-size:.96rem;margin-top:3px}.button,button{cursor:pointer}.button{display:inline-flex;justify-content:center;align-items:center;text-align:center;text-decoration:none;background:#123d56;border:1px solid #286585;color:var(--text);padding:10px 12px;border-radius:11px;font-size:.8rem;font-weight:750}.button.secondary{background:#112a3b;border-color:var(--line)}.button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.list{display:grid;gap:9px;margin-top:11px}.item{padding:12px;border:1px solid var(--line);background:#0c2132;border-radius:13px}.item h3{margin:0;font-size:.93rem}.item p{margin:5px 0 0}.tag{display:inline-block;color:var(--teal);font-size:.7rem;font-weight:750}.rule{height:1px;background:var(--line);margin:12px 0}.footer{padding:5px 5px 18px;color:var(--muted);font-size:.73rem}.map{height:260px;border-radius:14px;border:1px solid var(--line);z-index:0}.leaflet-container{background:#d6e5ea}.leaflet-control-attribution{font-size:10px!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10283b;color:#eef7ff}.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{display:block;text-align:left;width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#0c2132;color:var(--text)}.tile b{display:block;margin:4px 0}.tile span{color:var(--muted);font-size:.75rem}.empty{padding:14px;text-align:center;color:var(--muted)}.warning-card{border-color:#755d36}.steps{counter-reset:steps;display:grid;gap:9px}.step{counter-increment:steps;position:relative;padding-left:40px}.step:before{content:counter(steps);position:absolute;left:11px;top:11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#17425a;color:#a8e7ff;font-weight:800}
    @media(max-width:390px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(3,1fr)}.tile-grid{grid-template-columns:1fr}.live-state{font-size:.64rem}}
  </style>
</head>
<body>
  <header><div class="brand">🎣 Pancing Pintar<small>Panduan memancing Malaysia</small></div><div class="live-state" id="dataState">Menyemak data…</div></header>
  <main>
    <section class="card">
      <label class="control"><span class="label">Pilih kawasan</span><select id="area" aria-label="Pilih lokasi"></select></label>
      <nav class="tabs" id="tabs" aria-label="Menu aplikasi"></nav>
    </section>
    <div id="content" class="content" aria-live="polite"></div>
    <div class="footer">Ramalan cuaca bukan bacaan keadaan sebenar di laut. Semak sumber rasmi dan peraturan akses kawasan sebelum memancing. Aplikasi ini tidak menjamin hasil tangkapan atau keselamatan perjalanan.</div>
  </main>
<script>
  // Kawasan untuk carian/pusat peta sahaja, bukan pengesahan stesen rasmi atau spot memancing.
  const areas=[
    {id:'klang',name:'Pelabuhan Klang',state:'Selangor',lat:3.00,lon:101.39,search:'Klang'},
    {id:'kselangor',name:'Kuala Selangor',state:'Selangor',lat:3.34,lon:101.25,search:'Kuala Selangor'},
    {id:'sabakbernam',name:'Sabak Bernam',state:'Selangor',lat:3.77,lon:100.99,search:'Sabak Bernam'},
    {id:'penang',name:'Pulau Pinang',state:'Pulau Pinang',lat:5.42,lon:100.33,search:'Pulau Pinang'},
    {id:'langkawi',name:'Langkawi',state:'Kedah',lat:6.35,lon:99.80,search:'Langkawi'},
    {id:'kualaperlis',name:'Kuala Perlis',state:'Perlis',lat:6.40,lon:100.13,search:'Kuala Perlis'},
    {id:'kuantan',name:'Kuantan',state:'Pahang',lat:3.82,lon:103.33,search:'Kuantan'},
    {id:'melaka',name:'Melaka',state:'Melaka',lat:2.20,lon:102.15,search:'Melaka'},
    {id:'johor',name:'Johor Bahru',state:'Johor',lat:1.47,lon:103.75,search:'Johor Bahru'},
    {id:'geting',name:'Geting / Tumpat',state:'Kelantan',lat:5.88,lon:102.52,search:'Tumpat'},
    {id:'kotakinabalu',name:'Kota Kinabalu',state:'Sabah',lat:5.98,lon:116.08,search:'Kota Kinabalu'},
    {id:'kudat',name:'Kudat',state:'Sabah',lat:6.88,lon:116.84,search:'Kudat'},
    {id:'sandakan',name:'Sandakan',state:'Sabah',lat:5.84,lon:118.12,search:'Sandakan'},
    {id:'tawau',name:'Tawau',state:'Sabah',lat:4.25,lon:117.89,search:'Tawau'},
    {id:'kuching',name:'Kuching',state:'Sarawak',lat:1.55,lon:110.35,search:'Kuching'},
    {id:'bintulu',name:'Bintulu',state:'Sarawak',lat:3.17,lon:113.04,search:'Bintulu'},
    {id:'miri',name:'Miri',state:'Sarawak',lat:4.40,lon:113.99,search:'Miri'}
  ];
  const menu=[['home','Utama'],['weather','Cuaca'],['tide','Pasang'],['spots','Spot'],['fish','Ikan'],['rig','Setup'],['safety','SOS']];
  const state={area:'klang',tab:'home',current:'slow',place:'muara'};
  const API={forecast:'https://api.data.gov.my/weather/forecast?limit=1000',warning:'https://api.data.gov.my/weather/warning'};
  const CACHE='pancingpintar.weather.v2';
  let api={forecast:null,warnings:null,loadedAt:null,error:null,loading:false};
  let mapInstance=null;
  const $=id=>document.getElementById(id);
  const selected=()=>areas.find(a=>a.id===state.area)||areas[0];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const officialLinks=()=>`<div class="actions"><a class="button" href="https://developer.data.gov.my/realtime-api/weather" target="_blank" rel="noopener">API cuaca rasmi ↗</a><a class="button secondary" href="https://www.met.gov.my/en/forecast/marine/waters/" target="_blank" rel="noopener">Ramalan laut MetMalaysia ↗</a>`;
  function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c)api={...api,...c,error:null}}catch(_){}}
  function status(){const el=$('dataState');if(api.loading){el.textContent='Memuat cuaca…';return}if(api.loadedAt){const age=Date.now()-new Date(api.loadedAt).getTime();el.textContent=age>6*3600000?'Cuaca tersimpan · lama':'Cuaca API · '+new Date(api.loadedAt).toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});return}el.textContent=api.error?'API tiada sambungan':'Cuaca belum dimuat'}
  async function loadOfficialData(force=false){if(api.loading)return;if(api.loadedAt&&!force&&Date.now()-new Date(api.loadedAt).getTime()<60000)return;api.loading=true;api.error=null;status();if(state.tab==='weather'||state.tab==='home')render();try{const [fr,wr]=await Promise.all([fetch(API.forecast,{headers:{Accept:'application/json'},cache:'no-store'}),fetch(API.warning,{headers:{Accept:'application/json'},cache:'no-store'})]);if(!fr.ok)throw Error('Ramalan API HTTP '+fr.status);if(!wr.ok)throw Error('Amaran API HTTP '+wr.status);const [forecast,warnings]=await Promise.all([fr.json(),wr.json()]);api.forecast=forecast;api.warnings=warnings;api.loadedAt=new Date().toISOString();api.error=null;try{localStorage.setItem(CACHE,JSON.stringify(api))}catch(_){}}catch(e){api.error=e.message||'Sambungan gagal'}finally{api.loading=false;status();render()}}
  function rows(data){if(Array.isArray(data))return data;if(Array.isArray(data?.data))return data.data;if(Array.isArray(data?.results))return data.results;return data&&typeof data==='object'?[data]:[]}
  function locName(r){const l=r?.location;return typeof l==='string'?l:(l?.location_name||r?.location_name||r?.name||'')}
  function forecastForArea(){const list=rows(api.forecast),q=selected().search.toLowerCase();return list.find(r=>locName(r).toLowerCase()===q)||list.find(r=>locName(r).toLowerCase().includes(q))||null}
  function warningsForArea(){return rows(api.warnings).filter(w=>{const s=JSON.stringify(w).toLowerCase();return s.includes(selected().state.toLowerCase())||s.includes(selected().search.toLowerCase())}).slice(0,4)}
  function forecastCard(){const f=forecastForArea();if(!f)return `<div class="empty">${api.loading?'Sedang mendapatkan ramalan…':`Ramalan untuk ${esc(selected().search)} tidak ditemui. Tiada lokasi lain digunakan sebagai ganti.`}</div>`;return `<div class="item"><span class="tag">RAMALAN API · ${esc(locName(f))}</span><p class="tiny">${esc(f.date||'Tarikh tidak dinyatakan')}</p>${[['Pagi',f.morning_forecast],['Petang',f.afternoon_forecast],['Malam',f.night_forecast]].filter(x=>x[1]).map(([a,b])=>`<p><b>${a}:</b> ${esc(b)}</p>`).join('')}<p><b>Ringkasan:</b> ${esc(f.summary_forecast||'Tiada ringkasan')}</p>${f.min_temp!=null||f.max_temp!=null?`<p class="muted">Suhu ramalan ${esc(f.min_temp??'—')}–${esc(f.max_temp??'—')}°C</p>`:''}</div>`}
  function warningCard(){const list=warningsForArea();if(!list.length)return `<div class="item"><p class="muted">Tiada amaran sepadan ditemui dalam respons API ini. Semak terus MetMalaysia; ketiadaan rekod di sini bukan jaminan tiada risiko.</p></div>`;return list.map(w=>`<div class="item warning-card"><span class="tag">AMARAN CUACA</span><p>${esc(w.summary||w.warning||w.description||w.message||w.title||'Butiran tidak tersedia')}</p><p class="tiny">${esc(w.issued_at||w.issue_time||'Masa tidak dinyatakan')} · ${esc(w.areas_affected||w.area||selected().state)}</p></div>`).join('')}
  function home(){const f=forecastForArea();return `<section class="card"><div class="row"><div><span class="tag">KAWASAN DIPILIH</span><h2 style="margin-top:5px">${esc(selected().name)}, ${esc(selected().state)}</h2></div><span class="pill">${api.loadedAt?'Cuaca disemak':'Data belum disemak'}</span></div><p class="muted">Pilih bahagian di bawah. Lokasi ini ialah pusat rujukan/carían sahaja; bukan pengesahan stesen pasang surut atau spot ikan.</p><div class="tile-grid"><button class="tile" data-open="weather">🌦️ <b>Cuaca & amaran</b><span>${f?esc(f.summary_forecast||'Ramalan tersedia'):'Semak ramalan rasmi'}</span></button><button class="tile" data-open="tide">🌊 <b>Pasang surut</b><span>Rujuk jadual JUPEM rasmi</span></button><button class="tile" data-open="spots">📍 <b>Spot & peta</b><span>Cari kawasan; semak akses dan sumber</span></button><button class="tile" data-open="fish">🐟 <b>Aktiviti ikan</b><span>Tiada skor tangkapan direka</span></button><button class="tile" data-open="rig">🎣 <b>Setup & ladung</b><span>Panduan umum ikut arus diperhatikan</span></button><button class="tile" data-open="safety">🛟 <b>Keselamatan</b><span>Semak amaran sebelum ke laut</span></button></div></section><section class="card"><div class="row"><h2>Ramalan ringkas</h2><button class="button secondary" id="refresh">${api.loading?'Memuat…':'Muat semula'}</button></div><p class="muted">Sumber: API cuaca data.gov.my / MetMalaysia. Bukan bacaan laut semasa.</p>${api.loadedAt?`<p class="tiny">Dikemas kini ${new Date(api.loadedAt).toLocaleString('ms-MY')}</p>`:''}${api.error?`<div class="callout">API gagal: ${esc(api.error)}. Cuba semula apabila sambungan tersedia.</div>`:''}${forecastCard()}</section>`}
  function weather(){return `<section class="card"><div class="row"><h2>Cuaca & amaran · ${esc(selected().name)}</h2><button class="button secondary" id="refresh">${api.loading?'Memuat…':'Muat semula'}</button></div><p class="muted">Ramalan rasmi kawasan, bukan bacaan angin/ombak marin masa nyata.</p>${api.loadedAt?`<p class="tiny">Diambil ${new Date(api.loadedAt).toLocaleString('ms-MY')}</p>`:''}${api.error?`<div class="callout">Gagal mengambil kemas kini: ${esc(api.error)}.</div>`:''}<div class="list">${forecastCard()}</div>${officialLinks()}</section><section class="card"><h2>Amaran</h2><div class="list">${warningCard()}</div><p class="tiny">Sahkan amaran semasa secara terus dengan MetMalaysia.</p></section><section class="card"><h2>Data marin</h2><div class="grid"><div class="metric"><span class="tiny">Angin laut</span><b>Belum tersedia</b></div><div class="metric"><span class="tiny">Ombak</span><b>Belum tersedia</b></div><div class="metric"><span class="tiny">Arus laut</span><b>Belum tersedia</b></div><div class="metric"><span class="tiny">Masa bacaan</span><b>Tiada bacaan</b></div></div><p class="muted">Tidak ditukar kepada data cuaca darat atau model pihak ketiga.</p></section>`}
  function tide(){return `<section class="card"><div class="row"><h2>Pasang surut · ${esc(selected().name)}</h2><span class="pill">Belum disambung</span></div><p class="muted">Tiada waktu atau paras pasang surut ditunjukkan kerana belum disahkan jadual rasmi JUPEM untuk stesen dan tarikh ini.</p><div class="callout">Jangan gunakan angka anggaran untuk navigasi. Semak bahawa nama stesen, tarikh dan datum paras sepadan dengan lokasi anda.</div><div class="actions"><a class="button" href="https://www.jupem.gov.my/en/staps" target="_blank" rel="noopener">Buka rujukan JUPEM ↗</a></div><p class="tiny">Nama lokasi dalam senarai aplikasi tidak mengesahkan ia stesen rasmi JUPEM.</p></section>`}
  function spots(){const q=encodeURIComponent('tempat memancing '+selected().name);const video=encodeURIComponent('spot memancing '+selected().name);return `<section class="card"><div class="row"><h2>Kawasan & peta</h2><span class="pill">Pusat kawasan</span></div><p class="muted">Peta memaparkan pusat kawasan terpilih sahaja—bukan pin spot ikan, jeti yang dibenarkan atau tempat tangkapan disahkan.</p><div id="map" class="map" aria-label="Peta pusat kawasan"></div><p class="tiny">Peta © OpenStreetMap contributors. Sahkan akses, larangan memancing dan keadaan tempatan secara berasingan.</p><div class="actions"><a class="button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Cari kawasan di Maps ↗</a><a class="button secondary" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${video}">Cari video YouTube ↗</a><a class="button secondary" target="_blank" rel="noopener" href="https://www.tiktok.com/search?q=${video}">Cari TikTok ↗</a></div><div class="callout">Carian luar mungkin mengandungi maklumat lama atau tidak tepat; video bukan bukti ikan masih ada sekarang. Kami tidak menyalin kandungan daripada platform tersebut.</div></section>`}
  function fish(){return `<section class="card"><div class="row"><h2>Aktiviti ikan</h2><span class="pill">Belum ada data setempat</span></div><p class="muted">Saya tak paparkan skor atau dakwaan “ikan tengah aktif” kerana tiada rekod tangkapan/laporan yang boleh disahkan untuk ${esc(selected().name)}. Cuaca dan pasang surut sahaja tidak membuktikan ikan sedang makan.</p><div class="callout">Maklumat habitat berikut hanya panduan umum—bukan spot khusus atau jaminan hasil.</div><div class="list"><div class="item"><span class="tag">PANDUAN UMUM</span><h3>Muara & sungai</h3><p class="muted">Cari perubahan kedalaman, struktur dan aliran; spesies berbeza mengikut habitat serta musim.</p></div><div class="item"><span class="tag">PANDUAN UMUM</span><h3>Batu / karang</h3><p class="muted">Struktur dasar mungkin menjadi habitat ikan. Periksa ombak, arus, peraturan dan risiko sangkut.</p></div><div class="item"><span class="tag">PANDUAN UMUM</span><h3>Jeti / pesisir</h3><p class="muted">Sahkan kawasan memang dibuka untuk memancing dan selamat diakses.</p></div></div></section>`}
  function rig(){return `<section class="card"><h2>Panduan setup & batu ladung</h2><p class="muted">Ini anggaran permulaan umum. Masukkan keadaan arus yang anda perhatikan sendiri; app tidak mempunyai sensor arus di lokasi.</p><label class="control"><span class="label">Arus diperhatikan</span><select id="current"><option value="slow">Perlahan</option><option value="medium">Sederhana</option><option value="fast">Deras</option></select></label><label class="control"><span class="label">Jenis lokasi</span><select id="place"><option value="muara">Muara / sungai</option><option value="beach">Pantai</option><option value="rock">Jeti / batu</option><option value="boat">Bot / pancing dasar</option></select></label><div id="rigResult" class="item"></div><div class="rule"></div><h3>Setup ringkas</h3><div class="list"><div class="item"><b>Muara</b><p class="muted">Joran ringan/sederhana; udang atau gewang ikut sasaran, akses dan keadaan air.</p></div><div class="item"><b>Pancing dasar</b><p class="muted">Padankan joran, tali dan perambut dengan kedalaman, struktur serta saiz ikan sasaran.</p></div><div class="item"><b>Pantai / batu</b><p class="muted">Semak ombak dan laluan keluar. Jangan berdiri di batu licin atau zon hempasan ombak.</p></div></div><div class="callout">Cuba berat paling ringan yang masih menahan umpan dan laraskan bertahap. Julat ini bukan nasihat profesional atau bacaan arus sebenar.</div></section>`}
  function updateRig(){const c=$('current')?.value||'slow',p=$('place')?.value||'muara';const v={slow:'30–60 g (kira-kira 1–2 oz)',medium:'60–120 g (kira-kira 2–4 oz)',fast:'120–200 g (kira-kira 4–7 oz)'};const advice=p==='beach'?'Boleh cuba bentuk pyramid di pasir, jika perlu menahan umpan.':p==='rock'?'Bentuk mudah dilepaskan mungkin mengurangkan risiko sangkut; utamakan keselamatan.':p==='boat'?'Pilih bentuk mengikut arus dan dasar; mula dengan ringan.':'Gunakan berat secukupnya dan pastikan tidak mengganggu laluan bot.';$('rigResult').innerHTML=`<span class="tag">PANDUAN UMUM · BUKAN DATA LIVE</span><h3>${v[c]}</h3><p class="muted">${advice}</p>`}
  function safety(){return `<section class="card"><h2>Keselamatan di laut</h2><p class="muted">Aplikasi tidak boleh mengesahkan perjalanan selamat. Semak amaran rasmi pada hari perjalanan.</p><div class="steps"><div class="item step"><b>Semak ramalan dan amaran</b><p class="muted">Buka MetMalaysia dan Jabatan Laut Malaysia sebelum bertolak.</p></div><div class="item step"><b>Maklumkan waris</b><p class="muted">Kongsi laluan, bilangan kru dan waktu pulang yang dirancang.</p></div><div class="item step"><b>Pakai jaket keselamatan</b><p class="muted">Bawa alat komunikasi dan peralatan kecemasan yang sesuai untuk bot.</p></div><div class="item step"><b>Kecemasan</b><p class="muted">Hubungi 999; jika menggunakan radio maritim, ikut prosedur kecemasan berkaitan.</p></div></div>${officialLinks()}<a class="button secondary" href="https://www.marine.gov.my/" target="_blank" rel="noopener">Jabatan Laut Malaysia ↗</a></section>`}
  function render(){ $('area').innerHTML=areas.map(a=>`<option value="${a.id}">${esc(a.name)} · ${esc(a.state)}</option>`).join('');$('area').value=state.area;$('area').onchange=e=>{state.area=e.target.value;render()};$('tabs').innerHTML=menu.map(([k,n])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${n}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});const view={home,weather,tide,spots,fish,rig,safety}[state.tab];$('content').innerHTML=view();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.open;render()});if($('refresh'))$('refresh').onclick=()=>loadOfficialData(true);if(state.tab==='rig'){$('current').value=state.current;$('place').value=state.place;$('current').onchange=e=>{state.current=e.target.value;updateRig()};$('place').onchange=e=>{state.place=e.target.value;updateRig()};updateRig()}if(state.tab==='spots')initMap();status()}
  function initMap(){const el=$('map');if(!el)return;if(!window.L){el.innerHTML='<div class="empty">Peta tidak dapat dimuat. Gunakan pautan peta di atas.</div>';return}if(mapInstance){mapInstance.remove();mapInstance=null}const a=selected();mapInstance=L.map(el,{scrollWheelZoom:false}).setView([a.lat,a.lon],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(mapInstance);L.marker([a.lat,a.lon]).addTo(mapInstance).bindPopup(`<b>${esc(a.name)}</b><br>Pusat kawasan anggaran, bukan spot memancing.`);setTimeout(()=>mapInstance?.invalidateSize(),100)}
  readCache();render();loadOfficialData();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
