<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a2c">
  <meta name="description" content="Panduan memancing Malaysia dengan ramalan cuaca rasmi, rujukan pasang surut, kawasan carian dan panduan setup.">
  <title>Pancing Pintar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root{color-scheme:dark;--bg:#071a2c;--panel:#10283b;--panel2:#0c2234;--line:#29465a;--text:#eef7ff;--muted:#a9bfce;--blue:#43b9ff;--teal:#55ddc4;--gold:#ffcf70;--red:#ff7f87;--green:#73dfa0}
    *{box-sizing:border-box}body{margin:0 auto;max-width:640px;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% -10%,#164565 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 14px}.brand{font-size:1.2rem;font-weight:850;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:.75rem;font-weight:500}.live-state{font-size:.73rem;color:var(--gold);border:1px solid #6b5836;border-radius:20px;padding:5px 9px;white-space:nowrap}
    .card{background:linear-gradient(145deg,rgba(17,42,60,.97),rgba(12,32,49,.97));border:1px solid var(--line);border-radius:18px;padding:15px;margin:0 0 12px;box-shadow:0 9px 22px #0002}.card h2,.card h3{margin:0 0 6px;font-size:1rem}.muted{color:var(--muted);font-size:.82rem}.tiny{color:var(--muted);font-size:.73rem}.select,select,input{font:inherit;color:var(--text);background:#0b2031;border:1px solid var(--line);border-radius:12px;padding:11px;width:100%;outline:none}.control{display:grid;gap:7px;margin-bottom:12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}.tab{border:1px solid var(--line);border-radius:12px;background:#10283b;color:var(--muted);padding:10px 6px;font-weight:750;font-size:.8rem;cursor:pointer}.tab.active{color:var(--text);border-color:#3286b3;background:linear-gradient(135deg,#164366,#14534f)}.content{min-height:200px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-block;border:1px solid #41647a;border-radius:99px;padding:4px 9px;color:#b8e4f7;font-size:.72rem}.callout{border-left:3px solid var(--gold);padding:9px 11px;background:#211e18;border-radius:0 10px 10px 0;color:#ffe1a3;font-size:.8rem;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.metric{border:1px solid var(--line);background:#0c2132;border-radius:12px;padding:11px}.metric b{display:block;font-size:.96rem;margin-top:3px}.button,button{cursor:pointer}.button{display:inline-flex;justify-content:center;align-items:center;text-align:center;text-decoration:none;background:#123d56;border:1px solid #286585;color:var(--text);padding:10px 12px;border-radius:11px;font-size:.82rem;font-weight:750}.button.secondary{background:#112a3b;border-color:var(--line)}.button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.list{display:grid;gap:9px;margin-top:11px}.item{padding:12px;border:1px solid var(--line);background:#0c2132;border-radius:13px}.item h3{margin:0;font-size:.93rem}.item p{margin:5px 0 0}.tag{display:inline-block;color:var(--teal);font-size:.7rem;font-weight:750}.rule{height:1px;background:var(--line);margin:12px 0}.footer{padding:5px 5px 18px;color:var(--muted);font-size:.73rem}.label{display:block;color:var(--muted);font-size:.78rem;margin-bottom:4px}.range-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:16px;text-align:center;color:var(--muted)}.warning-card{border-color:#755d36}.api-note{overflow-wrap:anywhere}.weather-line{margin:6px 0}.map{height:290px;border-radius:14px;border:1px solid var(--line);z-index:0}.leaflet-container{background:#d6e5ea}.leaflet-control-attribution{font-size:10px!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10283b;color:#eef7ff}.leaflet-popup-content{font-family:system-ui,sans-serif}.fish-grid{display:grid;gap:9px}.step{counter-increment:steps;padding-left:34px;position:relative}.step:before{content:counter(steps);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#17425a;color:#a8e7ff;font-weight:800}.steps{counter-reset:steps;display:grid;gap:10px}.hide{display:none!important}
    @media(max-width:390px){.grid{grid-template-columns:1fr}.tab{font-size:.74rem}.live-state{font-size:.66rem}}
  </style>
</head>
<body>
  <header><div class="brand">🎣 Pancing Pintar<small>Panduan memancing Malaysia</small></div><div class="live-state" id="dataState">Menyemak data…</div></header>
  <main>
    <section class="card">
      <label class="control"><span class="label">Lokasi rujukan</span><select id="area" aria-label="Pilih lokasi rujukan"></select></label>
      <div class="muted">Lokasi carian bukan semestinya stesen pasang surut rasmi atau spot memancing yang disahkan.</div>
      <nav class="tabs" id="tabs" aria-label="Menu aplikasi"></nav>
    </section>
    <div id="content" class="content" aria-live="polite"></div>
    <div class="footer">Untuk keselamatan dan navigasi, utamakan amaran rasmi, carta nautika dan arahan pihak berkuasa. Data ramalan bukan jaminan keadaan sebenar di laut.</div>
  </main>
<script>
  const areas=[
    {id:'klang',name:'Pelabuhan Klang',state:'Selangor',lat:3.00,lon:101.39,search:'Klang'},
    {id:'kselangor',name:'Kuala Selangor',state:'Selangor',lat:3.34,lon:101.25,search:'Kuala Selangor'},
    {id:'sabakbernam',name:'Sabak Bernam',state:'Selangor',lat:3.77,lon:100.99,search:'Sabak Bernam'},
    {id:'penang',name:'Pulau Pinang',state:'Pulau Pinang',lat:5.42,lon:100.33,search:'Pulau Pinang'},
    {id:'langkawi',name:'Langkawi',state:'Kedah',lat:6.35,lon:99.80,search:'Langkawi'},
    {id:'kualaperlis',name:'Kuala Perlis',state:'Perlis',lat:6.40,lon:100.13,search:'Kuala Perlis'},
    {id:'kuantan',name:'Kuantan',state:'Pahang',lat:3.82,lon:103.33,search:'Kuantan'},
    {id:'tanjungkeling',name:'Tanjung Keling',state:'Melaka',lat:2.20,lon:102.15,search:'Melaka'},
    {id:'johor',name:'Johor Bahru',state:'Johor',lat:1.47,lon:103.75,search:'Johor Bahru'},
    {id:'geting',name:'Geting',state:'Kelantan',lat:5.88,lon:102.52,search:'Tumpat'},
    {id:'kotakinabalu',name:'Kota Kinabalu',state:'Sabah',lat:5.98,lon:116.08,search:'Kota Kinabalu'},
    {id:'kudat',name:'Kudat',state:'Sabah',lat:6.88,lon:116.84,search:'Kudat'},
    {id:'sandakan',name:'Sandakan',state:'Sabah',lat:5.84,lon:118.12,search:'Sandakan'},
    {id:'tawau',name:'Tawau',state:'Sabah',lat:4.25,lon:117.89,search:'Tawau'},
    {id:'kuching',name:'Kuching',state:'Sarawak',lat:1.55,lon:110.35,search:'Kuching'},
    {id:'bintulu',name:'Bintulu',state:'Sarawak',lat:3.17,lon:113.04,search:'Bintulu'},
    {id:'miri',name:'Miri',state:'Sarawak',lat:4.40,lon:113.99,search:'Miri'}
  ];
  const menu=[['weather','Cuaca'],['tide','Pasang surut'],['spots','Spot & peta'],['fish','Aktiviti ikan'],['rig','Setup & ladung'],['safety','Keselamatan']];
  const state={area:'klang',tab:'weather',current:'slow',place:'muara'};
  const API={forecast:'https://api.data.gov.my/weather/forecast?limit=1000',warning:'https://api.data.gov.my/weather/warning'};
  const CACHE='pancingpintar.weather.v1';
  let api={forecast:null,warnings:null,loadedAt:null,error:null,loading:false};
  let mapInstance=null;
  const $=id=>document.getElementById(id);
  const area=()=>areas.find(a=>a.id===state.area)||areas[0];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const officialLinks=()=>`<div class="actions"><a class="button" href="https://developer.data.gov.my/realtime-api/weather" target="_blank" rel="noopener">Dokumentasi API cuaca ↗</a><a class="button secondary" href="https://www.met.gov.my/en/forecast/marine/waters/" target="_blank" rel="noopener">Ramalan laut MetMalaysia ↗</a></div>`;
  function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c){api={...api,...c,error:null};}}catch(_){}}
  function setStatus(){const el=$('dataState');if(api.loading){el.textContent='Memuat data rasmi…';return}if(api.loadedAt){const age=Date.now()-new Date(api.loadedAt).getTime();el.textContent=age>6*3600000?'Data tersimpan · lama':'Data API · '+new Date(api.loadedAt).toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});return}el.textContent=api.error?'Data API tidak tersedia':'Menunggu data rasmi';}
  async function loadOfficialData(force=false){if(api.loading)return;if(api.loadedAt&&!force&&Date.now()-new Date(api.loadedAt).getTime()<60000)return;api.loading=true;api.error=null;setStatus();if(state.tab==='weather')render();try{const [fr,wr]=await Promise.all([fetch(API.forecast,{headers:{Accept:'application/json'},cache:'no-store'}),fetch(API.warning,{headers:{Accept:'application/json'},cache:'no-store'})]);if(!fr.ok)throw new Error('Ramalan API: HTTP '+fr.status);if(!wr.ok)throw new Error('Amaran API: HTTP '+wr.status);const [forecast,warnings]=await Promise.all([fr.json(),wr.json()]);api.forecast=forecast;api.warnings=warnings;api.loadedAt=new Date().toISOString();api.error=null;try{localStorage.setItem(CACHE,JSON.stringify(api))}catch(_){} }catch(err){api.error=err.message||'Sambungan data gagal';}finally{api.loading=false;setStatus();render();}}
  function arr(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.data))return data.data;if(data&&Array.isArray(data.results))return data.results;if(data&&typeof data==='object')return [data];return[]}
  function locationName(row){const l=row?.location;return typeof l==='string'?l:(l?.location_name||row?.location_name||row?.name||'')}
  function findForecast(){const rows=arr(api.forecast);const q=area().search.toLowerCase();return rows.find(r=>locationName(r).toLowerCase()===q)||rows.find(r=>locationName(r).toLowerCase().includes(q))||null}
  function warningText(w){return w.summary||w.warning||w.description||w.message||w.title||w.warning_text||w.text||''}
  function warningTime(w){return w.issued_at||w.issue_time||w.date_issued||w.updated_at||''}
  function warningsForArea(){const rows=arr(api.warnings);const key=(area().state+' '+area().name).toLowerCase();return rows.filter(w=>{const text=JSON.stringify(w).toLowerCase();return text.includes(area().state.toLowerCase())||text.includes(area().search.toLowerCase())||(!text.includes('area')&&!text.includes('location'))}).slice(0,5)}
  function weather(){const f=findForecast(),forecastBlock=f?`<div class="item"><span class="tag">RAMALAN AM · ${esc(locationName(f))}</span><p class="tiny">Tarikh ramalan: ${esc(f.date||'tidak dinyatakan')}</p>${[['Pagi',f.morning_forecast],['Petang',f.afternoon_forecast],['Malam',f.night_forecast]].filter(x=>x[1]).map(([label,text])=>`<p class="weather-line"><b>${label}:</b> ${esc(text)}</p>`).join('')}<p class="weather-line"><b>Ringkasan:</b> ${esc(f.summary_forecast||'Tiada ringkasan')}</p>${f.min_temp!=null||f.max_temp!=null?`<p class="weather-line">Suhu ramalan: ${esc(f.min_temp??'—')}–${esc(f.max_temp??'—')} °C</p>`:''}</div>`:`<div class="empty">${api.loading?'Sedang mendapatkan ramalan…':`Ramalan untuk “${esc(area().search)}” tidak ditemui dalam respons API. Tiada bacaan akan direka atau diganti senyap-senyap dengan lokasi lain.`}</div>`;const warns=warningsForArea();const warningBlock=warns.length?warns.map(w=>`<div class="item warning-card"><span class="tag">AMARAN RASMI · ${esc(warningTime(w)||'masa tidak dinyatakan')}</span><p>${esc(warningText(w)||'Buka sumber rasmi untuk butiran amaran.')}</p><p class="tiny">Kawasan: ${esc(w.areas_affected||w.area||w.location?.location_name||area().state)}</p></div>`).join(''):`<p class="muted">Tiada amaran yang sepadan ditemui dalam respons API sekarang. Sahkan terus di MetMalaysia; ketiadaan rekod di sini bukan jaminan tiada risiko.</p>`;return `<section class="card"><div class="row"><h2>Ramalan cuaca · ${esc(area().name)}</h2><button class="button secondary" id="refresh">${api.loading?'Memuat…':'Muat semula'}</button></div><p class="muted">Sumber: API cuaca rasmi data.gov.my / MetMalaysia. Ini ramalan umum, bukan bacaan angin atau ombak marin di lokasi bot.</p>${api.loadedAt?`<p class="tiny">Diambil pada ${new Date(api.loadedAt).toLocaleString('ms-MY')}</p>`:''}${api.error?`<div class="callout">Tidak dapat mengambil data terkini (${esc(api.error)}). Jika data tersimpan dipaparkan, semak cap masanya.</div>`:''}<div class="list">${forecastBlock}</div></section><section class="card"><h2>Amaran cuaca</h2><p class="muted">Semak amaran secara terus sebelum bergerak.</p><div class="list">${warningBlock}</div>${officialLinks()}</section><section class="card"><h2>Data marin</h2><p class="muted">Angin marin, ketinggian ombak dan arus tidak dipaparkan kerana suapan rasmi untuk lokasi ini belum disambungkan.</p><div class="grid"><div class="metric"><span class="tiny">Angin laut</span><b>Tiada data</b></div><div class="metric"><span class="tiny">Ombak</span><b>Tiada data</b></div><div class="metric"><span class="tiny">Arus laut</span><b>Tiada data</b></div><div class="metric"><span class="tiny">Sumber / masa</span><b>Belum tersedia</b></div></div></section>`}
  function tide(){return `<section class="card"><div class="row"><h2>Pasang surut · ${esc(area().name)}</h2><span class="pill">Tiada jadual disambung</span></div><p class="muted">Tiada nombor pasang surut dipaparkan sehingga jadual rasmi JUPEM untuk stesen dan tarikh pilihan dapat disambung serta disahkan.</p><div class="callout">Jangan gunakan anggaran pasang surut untuk navigasi atau keselamatan. Pilih stesen yang betul dan semak tarikh serta datum paras pada sumber rasmi.</div><div class="actions"><a class="button" href="https://www.jupem.gov.my/en/staps" target="_blank" rel="noopener">Buka rujukan pasang surut JUPEM ↗</a></div><div class="rule"></div><p class="tiny">Lokasi yang dipilih dalam app ialah kawasan carian. Ia tidak mengesahkan lokasi itu sebagai stesen ramalan JUPEM.</p></section>`}
  function spots(){const q=encodeURIComponent('tempat memancing '+area().name);const y=encodeURIComponent('spot memancing '+area().name);return `<section class="card"><div class="row"><h2>Kawasan & carian spot</h2><span class="pill">Rujukan luar</span></div><p class="muted">App tidak menyalin atau mengikis data daripada platform lain. Pautan ini membuka carian terus; semak sumber, tarikh, akses awam dan keadaan setempat sendiri.</p><div id="map" class="map" role="img" aria-label="Peta pusat kawasan carian, bukan pin spot memancing"></div><p class="tiny">Pin menunjukkan pusat kawasan secara anggaran sahaja—bukan spot memancing, koordinat jeti atau stesen rasmi. Peta © OpenStreetMap contributors.</p><div class="actions"><a class="button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(area().name)}">Peta Google ↗</a><a class="button secondary" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${y}">Video YouTube ↗</a><a class="button secondary" target="_blank" rel="noopener" href="https://www.tiktok.com/search?q=${y}">Carian TikTok ↗</a></div><div class="callout">Hasil tangkapan dalam video atau carian bukan bukti ikan masih ada sekarang. Jangan masuk kawasan larangan atau persendirian.</div></section>`}
  function fish(){return `<section class="card"><div class="row"><h2>Aktiviti ikan · ${esc(area().name)}</h2><span class="pill">Tiada rekod setempat</span></div><p class="muted">Saya tidak memaparkan skor “ikan aktif” kerana belum ada rekod tangkapan atau data biologi setempat yang boleh disahkan. Cuaca dan pasang surut sahaja tidak boleh membuktikan ikan sedang makan.</p><div class="callout">Kandungan di bawah ialah panduan habitat umum sahaja—bukan rekod spot atau jaminan hasil.</div><div class="list"><article class="item"><span class="tag">PANDUAN UMUM</span><h3>Muara & tebing sungai</h3><p class="muted">Cari struktur, perubahan kedalaman dan aliran; spesies yang hadir berubah ikut habitat, musim dan keadaan air.</p></article><article class="item"><span class="tag">PANDUAN UMUM</span><h3>Batu, karang & tukun</h3><p class="muted">Struktur dasar boleh menyediakan habitat. Semak peraturan kawasan, arus, ombak dan risiko sangkut.</p></article><article class="item"><span class="tag">PANDUAN UMUM</span><h3>Jeti & pesisir</h3><p class="muted">Sahkan akses memancing dibenarkan. Tidak semua kawasan pelabuhan atau jeti dibuka kepada orang awam.</p></article></div></section>`}
  function rig(){return `<section class="card"><h2>Panduan setup & batu ladung</h2><p class="muted">Pilih arus berdasarkan pemerhatian sendiri. Ini julat permulaan umum, bukan pengiraan berdasarkan sensor atau ramalan untuk lokasi anda.</p><label class="control"><span class="label">Arus yang diperhatikan</span><select id="current"><option value="slow">Perlahan</option><option value="medium">Sederhana</option><option value="fast">Deras</option></select></label><label class="control"><span class="label">Jenis kawasan</span><select id="place"><option value="muara">Muara / sungai</option><option value="beach">Pantai</option><option value="rock">Jeti / batu</option><option value="boat">Bot / pancing dasar</option></select></label><div id="rigResult" class="item"></div><div class="callout">Tambah berat sedikit demi sedikit sehingga ladung sekadar menahan umpan. Arus, kedalaman, tali dan dasar mengubah pilihan; utamakan keselamatan dan peraturan tempatan.</div><h3 style="margin-top:14px">Setup asas</h3><div class="list"><div class="item"><b>Muara</b><p class="muted">Spinning ringan/sederhana; udang atau gewang mengikut sasaran dan keadaan air.</p></div><div class="item"><b>Dasar / bot</b><p class="muted">Pilih kekuatan joran, tali dan perambut mengikut kedalaman, struktur dan saiz ikan sasaran.</p></div><div class="item"><b>Pantai / batu</b><p class="muted">Semak ombak, pasang, akses dan risiko gelombang hempas sebelum memilih teknik.</p></div></div></section>`}
  function updateRig(){const c=$('current')?.value||'slow',p=$('place')?.value||'muara';const vals={slow:'30–60 g (kira-kira 1–2 oz)',medium:'60–120 g (kira-kira 2–4 oz)',fast:'120–200 g (kira-kira 4–7 oz)'};const shape=p==='beach'?'Boleh cuba bentuk pyramid di dasar berpasir jika perlu menahan umpan.':p==='rock'?'Bentuk yang mudah dilepaskan mungkin mengurangkan sangkut; periksa struktur dan risiko sebelum guna.':p==='boat'?'Pilih bentuk mengikut arus dan dasar; uji ringan dahulu.':'Pilih berat ringan yang masih mengawal umpan; elakkan ganggu laluan bot.';$('rigResult').innerHTML=`<span class="tag">ANGGARAN UMUM SAHAJA</span><h3>${vals[c]}</h3><p class="muted">${shape}</p><p class="tiny">Tiada bacaan arus sebenar digunakan. Cuba bertahap dan laraskan ikut keadaan di tempat memancing.</p>`}
  function safety(){return `<section class="card"><h2>Keselamatan sebelum turun</h2><p class="muted">App ini tidak mempunyai suapan amaran laut khusus yang boleh digunakan untuk mengesahkan perjalanan selamat.</p><div class="steps"><div class="item step"><b>Semak amaran dan ramalan</b><p class="muted">Rujuk MetMalaysia dan Jabatan Laut Malaysia pada hari perjalanan.</p></div><div class="item step"><b>Beritahu orang dipercayai</b><p class="muted">Kongsi laluan, bilangan kru dan waktu pulang yang dirancang.</p></div><div class="item step"><b>Peralatan wajib</b><p class="muted">Pakai jaket keselamatan, bawa komunikasi dan kelengkapan kecemasan yang sesuai untuk bot.</p></div><div class="item step"><b>Jika kecemasan</b><p class="muted">Hubungi 999. Jika menggunakan radio maritim, ikut prosedur kecemasan yang berkenaan.</p></div></div><div class="actions"><a class="button" href="https://www.met.gov.my/en/forecast/marine/waters/" target="_blank" rel="noopener">MetMalaysia ↗</a><a class="button secondary" href="https://www.marine.gov.my/" target="_blank" rel="noopener">Jabatan Laut Malaysia ↗</a></div></section>`}
  function render(){ $('area').innerHTML=areas.map(a=>`<option value="${a.id}">${esc(a.name)} · ${esc(a.state)}</option>`).join('');$('area').value=state.area;$('area').onchange=e=>{state.area=e.target.value;render()};$('tabs').innerHTML=menu.map(([key,label])=>`<button class="tab ${state.tab===key?'active':''}" data-tab="${key}">${label}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});const view={weather,tide,spots,fish,rig,safety}[state.tab];$('content').innerHTML=view();if(state.tab==='weather'){$('refresh').onclick=()=>loadOfficialData(true)}if(state.tab==='rig'){$('current').value=state.current;$('place').value=state.place;$('current').onchange=e=>{state.current=e.target.value;updateRig()};$('place').onchange=e=>{state.place=e.target.value;updateRig()}}if(state.tab==='spots')initMap();setStatus()}
  function initMap(){const el=$('map');if(!el)return;if(!window.L){el.innerHTML='<div class="empty">Peta tidak dapat dimuat tanpa sambungan internet. Gunakan pautan peta di bawah.</div>';return}if(mapInstance){mapInstance.remove();mapInstance=null}const a=area();mapInstance=L.map(el,{scrollWheelZoom:false}).setView([a.lat,a.lon],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(mapInstance);L.marker([a.lat,a.lon]).addTo(mapInstance).bindPopup(`<b>${esc(a.name)}</b><br>Pusat kawasan anggaran — bukan spot memancing.`);setTimeout(()=>mapInstance.invalidateSize(),80)}
  readCache();render();loadOfficialData();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
