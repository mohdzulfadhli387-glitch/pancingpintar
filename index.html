<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>Pancing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#000;--card:#160808;--line:#7a1212;--gold:#ff3d3d;--tx:#fff;--mut:#f0cfcf;--bt:#000}
[data-t=day]{--bg:#fff;--card:#fff;--line:#a00000;--gold:#b00000;--tx:#000;--mut:#3a1010;--bt:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font:800 26px/1.1 Georgia,serif;color:var(--gold);margin:6px 0 14px}
h2{font:700 15px/1.2 system-ui;color:var(--gold);margin:0 0 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font:800 40px/1 Georgia,serif;color:var(--gold)}
.mut{color:var(--mut);font-size:15px}
.row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{font:700 18px system-ui;background:var(--gold);color:var(--bt);border:0;border-radius:10px;padding:14px 16px;min-height:52px;width:100%;margin-top:8px}
button.o{background:transparent;color:var(--gold);border:2px solid var(--gold)}
button.s{width:auto;min-height:40px;padding:8px 12px;margin:0;font-size:15px}
input,select,textarea{width:100%;font:18px system-ui;background:var(--bg);color:var(--tx);border:2px solid var(--line);border-radius:10px;padding:12px;margin:4px 0 10px;min-height:50px}
label{font-size:15px;font-weight:700;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border-radius:0;background:transparent;color:var(--mut);font-size:14px;min-height:64px;padding:6px 2px}
nav button.on{color:var(--bt);background:var(--gold)}
.bar{height:14px;background:var(--gold);border-radius:7px;margin:3px 0 8px}
.win{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.win:last-child{border:0}
#map{height:300px;border-radius:10px;border:2px solid var(--line);background:#222}
.x{color:var(--gold);background:none;border:0;width:auto;min-height:40px;margin:0;padding:6px 10px;font-size:20px}
[hidden]{display:none!important}
</style></head><body>
<main id="v"></main>
<nav id="nav"></nav>
<script>
const LS=localStorage,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=JSON.parse(LS.fishdb||'null')||{c:[],s:[],set:{token:'',theme:'night'}};
db.set=db.set||{token:'',theme:'night'};
const save=()=>LS.fishdb=JSON.stringify(db);
let pos=JSON.parse(LS.lastpos||'{"lat":3.1,"lon":101.7}'),env=JSON.parse(LS.env||'null'),tab='home';
const TABS=[['home','Utama'],['log','Tangkap'],['spot','Spot'],['stat','Statistik'],['set','Tetapan']];
document.documentElement.dataset.t=db.set.theme==='day'?'day':'';

/* ---------- helpers ---------- */
function moon(d=new Date()){const p=((((d/864e5+2440587.5)-2451550.1)%29.530588)+29.530588)%29.530588/29.530588;
 const n=['Bulan baru','Sabit awal','Suku pertama','Cembung awal','Purnama','Cembung akhir','Suku akhir','Sabit akhir'];
 return{p,name:n[Math.round(p*8)%8],ill:Math.round((1-Math.cos(2*Math.PI*p))/2*100)}}
const HM=['Muharram','Safar','Rabiulawal','Rabiulakhir','Jamadilawal','Jamadilakhir','Rejab','Syaaban','Ramadan','Syawal','Zulkaedah','Zulhijjah'];
function hijri(d=new Date()){let x;
 try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d).map(o=>[o.type,o.value]));x={d:+p.day,m:+p.month,y:parseInt(p.year)}}catch(e){}
 if(!x||!x.d||!x.m||!x.y||x.m>12){ // kiraan manual jika pelayar tak sokong
  let l=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)+2440588-1948440+10632,n=Math.floor((l-1)/10631);
  l=l-10631*n+354;const j=Math.floor((10985-l)/5316)*Math.floor(50*l/17719)+Math.floor(l/5670)*Math.floor(43*l/15238);
  l=l-Math.floor((30-j)/15)*Math.floor(17719*j/50)-Math.floor(j/16)*Math.floor(15238*j/43)+29;
  const m=Math.floor(24*l/709);x={d:l-Math.floor(709*m/24),m,y:30*n+j-30}}
 return `${x.d} ${HM[x.m-1]} ${x.y}`}
const dirs=['U','TL','T','TG','S','BD','B','BL'],dirN=d=>d==null?'':dirs[Math.round(d/45)%8];
const wx=c=>c==null?'-':c===0?'Cerah':c<=3?'Berawan':c<=48?'Kabus':c<=67?'Hujan':c<=77?'Hujan':c<=82?'Hujan lebat':'Ribut petir';
const fmt=d=>d.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit',hour12:false});
const getPos=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),no,{enableHighAccuracy:true,timeout:10000}):no());

/* ---------- data: cuaca + pasang surut ---------- */
async function load(){
 try{pos=await getPos();LS.lastpos=JSON.stringify(pos)}catch(e){}
 try{
  const q=`latitude=${pos.lat}&longitude=${pos.lon}&timezone=auto&forecast_days=2`;
  const [w,m]=await Promise.all([
   fetch(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code,pressure_msl&daily=sunrise,sunset&wind_speed_unit=kmh`).then(r=>r.json()),
   fetch(`https://marine-api.open-meteo.com/v1/marine?${q}&hourly=sea_level_height_msl,wave_height`).then(r=>r.json()).catch(()=>null)]);
  env={t:Date.now(),w,m};LS.env=JSON.stringify(env);
 }catch(e){}
 render();
}
function tides(){ // {ev:[{t,type,h}], lvl(i)}
 const h=env?.m?.hourly;if(!h||!h.sea_level_height_msl)return null;
 const T=h.time,L=h.sea_level_height_msl;if(L.every(x=>x==null))return null;
 const ev=[];for(let i=1;i<L.length-1;i++){if(L[i]==null||L[i-1]==null||L[i+1]==null)continue;
  if(L[i]>L[i-1]&&L[i]>=L[i+1])ev.push({t:new Date(T[i]),type:'Pasang',h:L[i]});
  if(L[i]<L[i-1]&&L[i]<=L[i+1])ev.push({t:new Date(T[i]),type:'Surut',h:L[i]})}
 return{T,L,ev}}
function nowIdx(T){const n=Date.now();let i=T.findIndex(x=>new Date(x)>=n);return i<0?T.length-1:Math.max(0,i)}
function snapshot(){
 const c=env?.w?.current||{},td=tides();let tide='';
 if(td){const nx=td.ev.find(e=>e.t>new Date());const i=nowIdx(td.T);const tr=td.L[i+1]>td.L[i]?'naik':'turun';tide=`Air ${tr}`+(nx?`, ${nx.type.toLowerCase()} ${fmt(nx.t)}`:'')}
 return{temp:c.temperature_2m,wind:c.wind_speed_10m,dir:c.wind_direction_10m,code:c.weather_code,press:c.pressure_msl,tide,moon:moon().name,hijri:hijri()}}

/* ---------- waktu terbaik ---------- */
function best(){
 const td=tides(),w=env?.w;if(!w&&!td)return null;
 const T=td?td.T:w.daily.time,hist=Array(24).fill(0);
 db.c.forEach(c=>hist[new Date(c.ts).getHours()]++);
 const hm=Math.max(1,...hist),mp=moon().p,spring=Math.abs(Math.cos(2*Math.PI*mp)); // baru/purnama ~1
 const sun=[...(w?.daily?.sunrise||[]),...(w?.daily?.sunset||[])].map(x=>new Date(x));
 const sc=[];const now=Date.now();
 if(td){var ch=[];for(let i=1;i<td.L.length-1;i++)ch[i]=Math.abs((td.L[i+1]??0)-(td.L[i-1]??0));var mx=Math.max(0.01,...ch.filter(x=>x))}
 for(let i=1;i<(td?td.T.length-1:0);i++){const t=new Date(td.T[i]);if(t<now||t-now>24*36e5)continue;
  let s=(ch[i]/mx)*45; // air bergerak
  if(sun.some(x=>Math.abs(x-t)<=1.5*36e5))s+=30; // subuh/senja
  s+=spring*10+(hist[t.getHours()]/hm)*15;
  sc.push({t,s:Math.round(s)})}
 if(!sc.length){ // tanpa data pasang surut: guna subuh/senja + sejarah
  for(let h=0;h<24;h++){const t=new Date();t.setHours(t.getHours()+h,0,0,0);let s=hist[t.getHours()]/hm*40+spring*10;if(sun.some(x=>Math.abs(x-t)<=1.5*36e5))s+=40;sc.push({t,s:Math.round(s)})}}
 const out=[];sc.sort((a,b)=>b.s-a.s).forEach(x=>{if(out.length<3&&out.every(o=>Math.abs(o.t-x.t)>2*36e5))out.push(x)});
 return out.sort((a,b)=>a.t-b.t)}

/* ---------- paparan ---------- */
function render(){
 $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
 ({home,log,spot,stat,set})[tab]();window.scrollTo(0,0)}
const go=k=>{tab=k;render()};

function home(){
 const c=env?.w?.current,td=tides(),m=moon(),b=best(),age=env?Math.round((Date.now()-env.t)/6e4):null;
 const evs=td?td.ev.filter(e=>e.t>new Date()).slice(0,4):[];
 $('#v').innerHTML=`<h1>Pancing</h1>
 <div class="card"><div class="row"><h2>Sekarang</h2><span class="mut">${env?(age<2?'baru dikemas kini':'data '+age+' min lepas'):'tiada data'}</span></div>
 ${c?`<div class="big">${Math.round(c.temperature_2m)}°C</div><div>${wx(c.weather_code)}</div>
 <div class="g2" style="margin-top:10px"><div><div class="mut">Angin</div><b>${Math.round(c.wind_speed_10m)} km/j ${dirN(c.wind_direction_10m)}</b></div>
 <div><div class="mut">Tekanan</div><b>${Math.round(c.pressure_msl)} hPa</b></div></div>`:'<p class="mut">Sambung internet sekali untuk dapatkan cuaca.</p>'}
 <button onclick="load()">Muat semula</button></div>
 <div class="card"><h2>Air pasang surut</h2>${evs.length?evs.map(e=>`<div class="win"><b>${e.type}</b><span>${fmt(e.t)} · ${e.h.toFixed(2)} m</span></div>`).join(''):'<p class="mut">Tiada data laut untuk lokasi ini (model global kurang di muara/sungai). Rujuk jadual rasmi.</p>'}</div>
 <div class="card"><h2>Waktu terbaik (24 jam)</h2>${b&&b.length?b.map(x=>`<div class="win"><b>${x.t.toLocaleDateString('ms-MY',{weekday:'short'})} ${fmt(x.t)}</b><span>skor ${x.s}</span></div>`).join('')+'<p class="mut">Berdasarkan pergerakan air, subuh/senja, bulan, dan rekod tangkapan kau.</p>':'<p class="mut">Perlukan data cuaca.</p>'}</div>
 <div class="card"><h2>Bulan dan tarikh</h2><div class="big" style="font-size:28px">${m.name}</div><div>${m.ill}% bercahaya</div><div class="mut" style="margin-top:6px">${hijri()} H (boleh beza 1 hari)</div></div>`}

function log(){
 const sp=db.s.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('');
 $('#v').innerHTML=`<h1>Catat tangkapan</h1><div class="card">
 <label>Spesies</label><input id="f_sp" placeholder="cth. Kerapu, Siakap" list="spl"><datalist id="spl">${[...new Set(db.c.map(c=>c.sp))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
 <div class="g2"><div><label>Berat (kg)</label><input id="f_kg" type="number" step="0.01" inputmode="decimal"></div><div><label>Panjang (cm)</label><input id="f_cm" type="number" inputmode="decimal"></div></div>
 <label>Umpan</label><input id="f_bait" list="bl" placeholder="cth. udang hidup"><datalist id="bl">${[...new Set(db.c.map(c=>c.bait))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
 <label>Joran / tekel</label><input id="f_rod" placeholder="cth. joran 7ft, reel 4000, leader 20lb" value="${esc(LS.lastrod||'')}">
 <label>Spot</label><select id="f_spot"><option value="">Lokasi GPS semasa</option>${sp}</select>
 <label>Nota</label><textarea id="f_note" rows="2"></textarea>
 <button onclick="addCatch()">Simpan tangkapan</button><p class="mut">Masa, cuaca, angin, air dan bulan direkod automatik.</p></div>
 <h2>Terkini (${db.c.length})</h2>${db.c.slice().reverse().slice(0,30).map(c=>`<div class="card"><div class="row"><b>${esc(c.sp)||'?'} ${c.kg?c.kg+' kg':''}</b><button class="x" onclick="delC('${c.id}')">✕</button></div>
 <div class="mut">${new Date(c.ts).toLocaleString('ms-MY')} · ${c.snap?.hijri||''}</div><div>${esc(c.bait)} · ${esc(c.spot)}</div>
 <div class="mut">${c.snap?.temp!=null?Math.round(c.snap.temp)+'°C, angin '+Math.round(c.snap.wind)+' km/j '+dirN(c.snap.dir)+', ':''}${esc(c.snap?.tide||'')}, ${esc(c.snap?.moon||'')}</div></div>`).join('')||'<p class="mut">Belum ada rekod.</p>'}`}
async function addCatch(){
 const g=id=>$('#'+id).value.trim();let p=pos,name='GPS';
 const si=g('f_spot');if(si!==''){const s=db.s[+si];p={lat:s.lat,lon:s.lon};name=s.name}
 else{try{p=await getPos();pos=p}catch(e){}}
 LS.lastrod=g('f_rod');
 db.c.push({id:Date.now()+'',ts:Date.now(),lat:p.lat,lon:p.lon,spot:name,sp:g('f_sp'),kg:+g('f_kg')||0,cm:+g('f_cm')||0,bait:g('f_bait'),rod:g('f_rod'),note:g('f_note'),snap:snapshot()});
 save();log()}
function delC(id){if(confirm('Padam rekod ini?')){db.c=db.c.filter(c=>c.id!==id);save();log()}}

/* ---------- peta (Mapbox) ---------- */
let map,mk=[];
function spot(){
 $('#v').innerHTML=`<h1>Spot</h1>
 ${db.set.token?'<div id="map"></div><p class="mut">Tekan lama atau ketik peta untuk simpan spot baru.</p>':'<div class="card"><p>Masukkan token Mapbox di Tetapan untuk papar peta.</p></div>'}
 <button onclick="saveHere()">Simpan lokasi semasa sebagai spot</button>
 <div style="height:12px"></div>
 ${db.s.map((s,i)=>{const n=db.c.filter(c=>c.spot===s.name);return`<div class="card"><div class="row"><b>${esc(s.name)}</b><button class="x" onclick="delS(${i})">✕</button></div>
 <div class="mut">${s.lat.toFixed(5)}, ${s.lon.toFixed(5)} · ${n.length} tangkapan</div>
 <a style="color:var(--gold);font-weight:700" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}">Navigasi</a></div>`}).join('')||'<p class="mut">Belum ada spot.</p>'}`;
 if(db.set.token)loadMap()}
async function saveHere(){try{pos=await getPos();LS.lastpos=JSON.stringify(pos)}catch(e){}addSpot(pos.lat,pos.lon)}
function addSpot(lat,lon){const n=prompt('Nama spot?');if(!n)return;db.s.push({name:n.trim(),lat,lon});save();spot()}
function delS(i){if(confirm('Padam spot ini? Rekod tangkapan kekal.')){db.s.splice(i,1);save();spot()}}
function loadMap(){
 if(window.mapboxgl)return initMap();
 const l=document.createElement('link');l.rel='stylesheet';l.href='https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css';document.head.append(l);
 const s=document.createElement('script');s.src='https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js';s.onload=initMap;
 s.onerror=()=>msg('Skrip peta tak dapat dimuat. Sebab biasa: tiada internet, atau fail dibuka dalam pratonton app Claude (sekat sambungan luar). Buka dalam Chrome.');document.head.append(s)}
const msg=t=>{const m=$('#map');if(m)m.innerHTML='<p style="padding:14px">'+esc(t)+'</p>'};
function initMap(){
 if(!mapboxgl.supported())return msg('Peta perlukan WebGL. Cuba Chrome terkini.');
 mapboxgl.accessToken=db.set.token;map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/satellite-streets-v12',center:[pos.lon,pos.lat],zoom:11});
 map.on('click',e=>addSpot(e.lngLat.lat,e.lngLat.lng));
 map.on('error',e=>{const c=e.error&&e.error.status;if(c===401||c===403)msg('Token Mapbox ditolak ('+c+'). Semak token di Tetapan: mesti bermula pk. dan tiada sekatan URL.');});
 db.s.forEach(s=>new mapboxgl.Marker({color:'#ff3d3d'}).setLngLat([s.lon,s.lat]).setPopup(new mapboxgl.Popup().setText(s.name)).addTo(map));
 new mapboxgl.Marker({color:'#ffffff'}).setLngLat([pos.lon,pos.lat]).addTo(map)}

/* ---------- statistik ---------- */
function group(key){const m={};db.c.forEach(c=>{const k=key(c);if(!k)return;m[k]=m[k]||{n:0,kg:0};m[k].n++;m[k].kg+=c.kg||0});return Object.entries(m).sort((a,b)=>b[1].n-a[1].n||b[1].kg-a[1].kg).slice(0,5)}
function list(title,arr){const mx=Math.max(1,...arr.map(a=>a[1].n));
 return`<div class="card"><h2>${title}</h2>${arr.map(([k,v])=>`<div class="row"><b>${esc(k)}</b><span>${v.n}× · ${v.kg.toFixed(1)} kg</span></div><div class="bar" style="width:${v.n/mx*100}%"></div>`).join('')||'<p class="mut">Belum cukup data.</p>'}</div>`}
function stat(){
 const tot=db.c.reduce((a,c)=>a+(c.kg||0),0);
 $('#v').innerHTML=`<h1>Statistik</h1><div class="card g2"><div><div class="big">${db.c.length}</div><div class="mut">tangkapan</div></div><div><div class="big">${tot.toFixed(1)}</div><div class="mut">kg jumlah</div></div></div>
 ${list('Umpan paling menjadi',group(c=>c.bait?.toLowerCase()))}
 ${list('Spot paling menjadi',group(c=>c.spot))}
 ${list('Waktu paling menjadi',group(c=>{const h=new Date(c.ts).getHours(),a=h-h%2;return`${String(a).padStart(2,'0')}:00–${String(a+2).padStart(2,'0')}:00`}))}
 ${list('Spesies',group(c=>c.sp))}
 ${list('Fasa bulan',group(c=>c.snap?.moon))}`}

/* ---------- tetapan + backup ---------- */
function set(){
 $('#v').innerHTML=`<h1>Tetapan</h1><div class="card"><label>Token Mapbox (pk.…)</label><input id="tok" value="${esc(db.set.token)}" placeholder="pk.eyJ...">
 <button onclick="db.set.token=$('#tok').value.trim();save();alert('Disimpan')">Simpan token</button>
 <button class="o" onclick="db.set.theme=db.set.theme==='day'?'night':'day';save();document.documentElement.dataset.t=db.set.theme==='day'?'day':'';render()">Tukar mod: ${db.set.theme==='day'?'Siang (putih merah)':'Malam (merah hitam)'}</button></div>
 <div class="card"><h2>Backup data</h2><p class="mut">${db.c.length} tangkapan, ${db.s.length} spot. Eksport selalu, simpan dalam Google Drive atau emel kepada diri sendiri.</p>
 <button onclick="exp()">Eksport (JSON)</button><button class="o" onclick="$('#imp').click()">Import</button>
 <input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])">
 <button class="o" onclick="expCsv()">Eksport CSV (untuk Excel)</button></div>`}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
const day=()=>new Date().toISOString().slice(0,10);
function exp(){dl(`pancing-backup-${day()}.json`,JSON.stringify(db),'application/json')}
function expCsv(){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
 dl(`pancing-${day()}.csv`,'tarikh,hijri,spesies,kg,cm,umpan,joran,spot,lat,lon,suhu,angin,air,bulan,nota\n'+db.c.map(c=>[new Date(c.ts).toLocaleString('ms-MY'),c.snap?.hijri,c.sp,c.kg,c.cm,c.bait,c.rod,c.spot,c.lat,c.lon,c.snap?.temp,c.snap?.wind,c.snap?.tide,c.snap?.moon,c.note].map(q).join(',')).join('\n'),'text/csv')}
function imp(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.c)||!Array.isArray(d.s))throw 0;
 if(confirm('Ganti semua data sekarang dengan fail ini?')){db=d;db.set=db.set||{token:'',theme:'night'};save();document.documentElement.dataset.t=db.set.theme==='day'?'day':'';render()}}catch(e){alert('Fail tidak sah')}})}

render();load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
