<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pancing Pintar</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#061019"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef3f7;--card:#fff;--tx:#0c1c2c;--mut:#5b6c7d;--ac:#0b7fc7;--ln:#d3dee8;--ok:#0f9a64;--wn:#c48a00;--bd:#d33f38;--gd:#f1c232;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061019;--card:#0d1c2b;--tx:#e6f0f8;--mut:#8fa4b8;--ac:#3db4ff;--ln:#1c3246;--ok:#27d38f;--wn:#f0b429;--bd:#ff6b61;--gd:#f1c232;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#061019;--card:#0d1c2b;--tx:#e6f0f8;--mut:#8fa4b8;--ac:#3db4ff;--ln:#1c3246;--ok:#27d38f;--wn:#f0b429;--bd:#ff6b61;--gd:#f1c232;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:14px 14px 40px}
h1{font:700 26px/1.1 Georgia,serif;margin:4px 0 2px;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;width:100%;box-sizing:border-box}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;font:inherit;font-weight:600;padding:10px 2px;font-size:13px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--mut)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs button.sos.on{background:var(--bd);border-color:var(--bd)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font:700 28px/1.1 Georgia,serif}
.mut{color:var(--mut);font-size:13px}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.bar i{height:14px;border-radius:3px;background:var(--ln)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.strip div{flex:0 0 52px;text-align:center;border:1px solid var(--ln);border-radius:10px;padding:6px 2px;font-size:12px}
.strip b{display:block;font-size:15px}
.nav{display:flex;gap:6px;align-items:center}
.nav button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mut);font-size:10px}
ul{margin:6px 0 0;padding-left:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:13px;border-radius:12px;border:0;color:#fff;background:var(--bd);width:100%;margin-top:8px;box-sizing:border-box}
.btn.g{background:var(--ok)}
details{border-top:1px solid var(--ln);padding:8px 0}summary{cursor:pointer;font-weight:700}
.warn{font-size:12px;color:var(--mut);border-top:1px solid var(--ln);padding-top:10px;margin-top:6px}
</style></head><body>
<h1>Pancing Pintar</h1>
<p class="sub">Kalkulator memancing pintar</p>
<select id="port" aria-label="Lokasi"></select>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
<p class="warn">Pasang surut dikira dengan model harmonik ringkas (anggaran), bukan jadual rasmi. Untuk navigasi dan keselamatan, rujuk Jabatan Laut Malaysia dan MetMalaysia.</p>
<script>
const P={klang:{n:"Pelabuhan Klang, Selangor",m:3.0,a:1.2,s:.5,h:12.5,la:3.0,lo:101.39},ks:{n:"Kuala Selangor, Selangor",m:2.9,a:1.15,s:.48,h:12.8,la:3.34,lo:101.25},pd:{n:"Port Dickson, N. Sembilan",m:1.8,a:.8,s:.3,h:12,la:2.5,lo:101.8},pg:{n:"Pulau Pinang",m:1.5,a:.7,s:.3,h:11.5,la:5.4,lo:100.34},kt:{n:"Kuantan, Pahang",m:1.2,a:.4,s:.1,h:10,la:3.97,lo:103.43}};
const EP=Date.UTC(2000,0,6,18,14),SYN=29.530588,R=Math.PI/180;
const $=id=>document.getElementById(id);
let st={port:"klang",day:0,tab:"t",wind:5,gust:8,pr:1011,tr:"s",ts:false};
try{Object.assign(st,JSON.parse(localStorage.getItem("tw")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("tw",JSON.stringify({port:st.port,wind:st.wind,gust:st.gust,pr:st.pr,tr:st.tr}))}catch(e){}};
const HM=ms=>{const p=P[st.port],x=(ms-EP)/36e5-(((p.h-2.2333)%12)+12)%12;return p.m+p.a*Math.cos(28.9841*R*x)+p.s*Math.cos(30*R*x)};
let OF={};
function parseOF(t){const o=[];t.split("\n").forEach(l=>{let m=l.match(/(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2})[:.](\d{2})\s+(-?\d+(?:\.\d+)?)/),y,mo,d;
if(m){y=+m[1];mo=+m[2];d=+m[3]}else{m=l.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})\s+(\d{1,2})[:.](\d{2})\s+(-?\d+(?:\.\d+)?)/);if(!m)return;d=+m[1];mo=+m[2];y=+m[3]}
o.push({t:new Date(y,mo-1,d,+m[4],+m[5]).getTime(),h:+m[6]})});return o.sort((a,b)=>a.t-b.t)}
function loadOF(){OF={};for(const k in P){let t="";try{t=localStorage.getItem("twt_"+k)||""}catch(e){}OF[k]=parseOF(t)}}
const cov=ms=>{const o=OF[st.port]||[];return o.length>1&&ms>=o[0].t&&ms<=o[o.length-1].t};
function H(ms){const o=OF[st.port]||[];if(cov(ms)){let lo=0,hi=o.length-1;while(hi-lo>1){const mid=(lo+hi)>>1;if(o[mid].t<=ms)lo=mid;else hi=mid}const a=o[lo],b=o[hi];if(b.t>a.t&&b.t-a.t<=9*36e5)return a.h+(b.h-a.h)*(1-Math.cos(Math.PI*(ms-a.t)/(b.t-a.t)))/2}return HM(ms)}
loadOF();
const age=ms=>(((ms-EP)/864e5)%SYN+SYN)%SYN;
function kind(a){const q=SYN/4;if(Math.min(a,SYN-a,Math.abs(a-2*q))<2.2)return["Pasang Besar","var(--bd)"];if(Math.min(Math.abs(a-q),Math.abs(a-3*q))<2.2)return["Air Mati","var(--ok)"];
return(a>q&&a<2*q)||(a>3*q)?["Menyorong Besar","#8b5cf6"]:["Menyorong Kecil","var(--wn)"]}
const moon=a=>["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"][Math.round(a/SYN*8)%8];
const f2=n=>String(n).padStart(2,"0"),hm=m=>f2(Math.floor(m/60))+":"+f2(Math.round(m%60)).replace("60","59");
function dayStart(o){const d=new Date();d.setHours(0,0,0,0);return d.getTime()+(o||0)*864e5}
function ext(d0){const o=[];let pv=H(d0-36e5*.1),cu=H(d0);for(let m=6;m<=1440;m+=6){const nx=H(d0+m*6e4),t=m-6;
if(cu>pv&&cu>nx)o.push({t,h:cu,hi:1});if(cu<pv&&cu<nx)o.push({t,h:cu,hi:0});pv=cu;cu=nx}return o}
function score(ms,d0){const p=P[st.port],rate=Math.abs(H(ms+9e5)-H(ms-9e5))/.5/(2*Math.PI/12.42*(p.a+p.s));
const k=kind(age(ms))[0],f=[];
const mv=Math.min(1,rate)*4;f.push(["Pergerakan air",mv]);
f.push(["Fasa bulan ("+k+")",k=="Pasang Besar"?1.5:k=="Air Mati"?0:.75]);
const pr={s:1,u:0,d:1.5,dd:-1}[st.tr];f.push(["Tekanan udara",pr]);
const hr=new Date(ms).getHours()+new Date(ms).getMinutes()/60;f.push(["Waktu (subuh/senja)",(hr>5.5&&hr<8.5)||(hr>17.5&&hr<20)?1.5:0]);
const m0=(ms-d0)/6e4,gh=ext(d0).some(e=>e.hi&&Math.abs(e.t-m0)<=60);f.push(["Golden hour (sekitar air pasang)",gh?1:0]);
if(st.ts)f.push(["Ribut petir",-4]);
const tot=f.reduce((a,b)=>a+b[1],0),sc=Math.max(1,Math.min(10,Math.round(tot/9.5*10)));return{sc,f}}
function offCard(){let t="";try{t=localStorage.getItem("twt_"+st.port)||""}catch(e){}const n=(OF[st.port]||[]).length;
return`<div class="c"><b>Jadual rasmi PHN (${P[st.port].n.split(",")[0]})</b><p class="mut">Salin dari hydro.gov.my. Satu baris setiap pasang atau surut: <b>2026-11-08 05:12 1.4</b> (tarikh, masa, ketinggian meter). Format 08/11/2026 05:12 1.4 juga boleh. Bila ada, graf dan semua cadangan guna angka ini.</p><textarea id="ot" rows="6" style="font-family:monospace">${t.replace(/</g,"&lt;")}</textarea><button class="btn g" id="os">Simpan jadual (${n} entri aktif)</button><a class="btn" style="background:var(--ac)" target="_blank" rel="noopener" href="https://hydro.gov.my/ramalanpasangsurut/">Buka laman PHN</a></div>`}
function tideView(){const d0=dayStart(st.day),dt=new Date(d0),a=age(d0+432e5),[kn,kc]=kind(a),ex=ext(d0);
let hj="";try{const pp=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(dt),g=t=>+pp.find(x=>x.type==t).value;hj=g("day")+" "+["Muharram","Safar","Rabiulawal","Rabiulakhir","Jamadilawal","Jamadilakhir","Rejab","Syaaban","Ramadan","Syawal","Zulkaedah","Zulhijjah"][g("month")-1]+" "+g("year")+" H (anggaran)"}catch(e){}
const pts=[];let lo=9,hi=-9;for(let m=0;m<=1440;m+=15){const h=H(d0+m*6e4);pts.push([m,h]);lo=Math.min(lo,h);hi=Math.max(hi,h)}
const X=m=>20+m/1440*300,Y=h=>140-(h-lo+.3)/(hi-lo+.6)*120;
let g=ex.filter(e=>e.hi).map(e=>`<rect x="${X(e.t-60)}" y="10" width="${X(60)-20}" height="130" fill="var(--gd)" opacity=".22"/>`).join("");
g+=`<path d="M${pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("L")}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>`;
g+=ex.map(e=>`<circle cx="${X(e.t)}" cy="${Y(e.h)}" r="3.5" fill="var(--ac)"/><text x="${X(e.t)}" y="${Y(e.h)+(e.hi?-7:14)}" text-anchor="middle">${e.h.toFixed(1)}m</text>`).join("");
const nowM=(Date.now()-d0)/6e4;if(st.day==0)g+=`<line x1="${X(nowM)}" x2="${X(nowM)}" y1="10" y2="140" stroke="var(--bd)" stroke-dasharray="3 3"/><text x="${X(nowM)}" y="8" text-anchor="middle" style="fill:var(--bd)">SEKARANG</text>`;
g+=[0,6,12,18,24].map(h=>`<text x="${X(h*60)}" y="156" text-anchor="middle">${f2(h)}:00</text>`).join("");
const ms=st.day==0?Date.now():d0+252e5,S=score(ms,d0),L=S.sc<=3?["Rendah","var(--bd)"]:S.sc<=5?["Sederhana","var(--wn)"]:S.sc<=7?["Aktif","var(--ok)"]:["Sangat aktif","var(--ok)"];
let strip="";for(let i=0;i<14;i++){const s=dayStart(st.day+i),k=kind(age(s+432e5));let l=9,h=-9;for(let m=0;m<1440;m+=30){const v=H(s+m*6e4);l=Math.min(l,v);h=Math.max(h,v)}
strip+=`<div style="border-color:${k[1]}"><span class="mut">${new Date(s).getDate()}</span><b>${moon(age(s+432e5))}</b>${(h-l).toFixed(1)}m</div>`}
return`<div class="c"><div class="row"><div class="nav"><button data-d="-1">◀</button><button data-d="1">▶</button></div><div style="text-align:right"><b>${dt.toLocaleDateString("ms-MY",{weekday:"long",day:"numeric",month:"long"})}</b><div class="mut">${hj}</div><div class="mut">Sumber: ${cov(d0+432e5)?"jadual rasmi (anda)":"anggaran model"}</div></div></div>
<div class="row" style="margin-top:10px"><span class="big">${moon(a)} ${kn}</span><span class="pill" style="background:${kc}">${a.toFixed(0)} hari bulan</span></div></div>
<div class="c"><b>Graf pasang surut</b> <span class="mut">(kawasan kuning = golden hour)</span><svg viewBox="0 0 340 162">${g}</svg>
<div class="grid">${ex.map(e=>`<div><b>${hm(e.t)}</b> ${e.hi?"Pasang":"Surut"} <span class="mut">${e.h.toFixed(1)}m</span></div>`).join("")}</div></div>
<div class="c"><div class="row"><b>Indikator aktiviti ikan</b><span class="mut">${st.day==0?"sekarang":"07:00"}</span></div>
<div class="big" style="color:${L[1]}">${L[0]} · ${S.sc}/10</div>
<div class="bar">${Array.from({length:10},(_,i)=>`<i style="${i<S.sc?"background:"+L[1]:""}"></i>`).join("")}</div>
<ul class="mut">${S.f.map(x=>`<li>${x[0]}: ${x[1]>0?"+":""}${x[1].toFixed(1)}</li>`).join("")}</ul></div>
<div class="c"><b>14 hari akan datang</b> <span class="mut">(julat pasang surut)</span><div class="strip" style="margin-top:8px">${strip}</div>
<div class="mut">Merah: pasang besar · Hijau: air mati · Kuning/ungu: menyorong</div></div>${offCard()}`}
const LV={};
const WX=c=>c==0?"Cerah":c<3?"Sebahagian berawan":c==3?"Mendung":c<50?"Kabus":c<70?"Hujan":c<85?"Hujan lebat":c>=95?"Ribut petir":"Hujan";
function pos(){return new Promise(r=>{const p=P[st.port],d=()=>r({la:p.la,lo:p.lo,gps:0});navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>r({la:x.coords.latitude,lo:x.coords.longitude,gps:1}),d,{timeout:6000}):d()})}
async function live(){LV.busy=1;LV.err="";if(st.tab=="w")render();try{const q=await pos(),b="latitude="+q.la+"&longitude="+q.lo;
const f=await(await fetch("https://api.open-meteo.com/v1/forecast?"+b+"&current=temperature_2m,wind_speed_10m,wind_gusts_10m,pressure_msl,weather_code&hourly=pressure_msl&wind_speed_unit=kn&past_hours=3&forecast_hours=1&timezone=auto")).json();
const c=f.current,hp=f.hourly.pressure_msl.filter(x=>x!=null),d=hp[hp.length-1]-hp[0];
st.wind=Math.round(c.wind_speed_10m*10)/10;st.gust=Math.round(c.wind_gusts_10m*10)/10;st.pr=Math.round(c.pressure_msl);st.tr=d<-3?"dd":d<-1?"d":d>1?"u":"s";st.ts=c.weather_code>=95;
Object.assign(LV,{t:c.temperature_2m,wx:WX(c.weather_code),gps:q.gps,at:new Date()});
try{const m=await(await fetch("https://marine-api.open-meteo.com/v1/marine?"+b+"&current=wave_height,ocean_current_velocity")).json();LV.wave=m.current.wave_height;LV.cur=m.current.ocean_current_velocity==null?null:m.current.ocean_current_velocity/1.852}catch(e){LV.wave=LV.cur=null}
}catch(e){LV.err="Tidak dapat ambil data langsung. Semak sambungan internet."}LV.busy=0;render()}
function liveCard(){const t=LV.at?LV.at.toLocaleTimeString("ms-MY",{hour:"2-digit",minute:"2-digit"}):"";
return`<div class="c"><div class="row"><b>Data langsung</b><button class="btn g" id="rf" style="width:auto;margin:0;padding:8px 14px">${LV.busy?"Memuat...":"Muat semula"}</button></div>`+(LV.err?`<p style="color:var(--bd)">${LV.err}</p>`:LV.at?`<div class="grid" style="margin-top:8px"><div><b>${LV.wx}</b><div class="mut">${LV.t}°C</div></div><div><b>Ombak ${LV.wave==null?"-":LV.wave.toFixed(1)+" m"}</b><div class="mut">Arus ${LV.cur==null?"-":LV.cur.toFixed(1)+" knot"}</div></div></div><div class="mut" style="margin-top:6px">${LV.gps?"Lokasi GPS":"Lokasi pelabuhan"} · dikemas kini ${t} · Open-Meteo (model, bukan stesen setempat)</div>`:`<p class="mut">Belum dimuatkan.</p>`)+`</div>`}
function windView(){const w=+st.wind,g=+st.gust;let v;
if(st.ts||g>=25||w>=20)v=["Jangan turun ke laut","var(--bd)","Angin kencang atau ribut petir. Kekal di darat."];
else if(w>=15||g>=20)v=["Bahaya untuk bot kecil","var(--bd)","Ombak boleh naik cepat. Elakkan pantai terbuka."];
else if(w>=10||g>=15)v=["Berhati-hati","var(--wn)","Pakai jaket keselamatan dan pantau cuaca."];
else v=["Angin tenang","var(--ok)","Tetap semak ramalan MetMalaysia sebelum bertolak."];
return liveCard()+`<div class="c"><b>Bacaan (boleh diubah)</b><p class="mut">Diisi automatik daripada data langsung. Ubah jika anda ada bacaan lebih tepat.</p>
<div class="grid"><div><label>Angin (knot)</label><input type="number" id="wind" value="${w}" min="0"></div><div><label>Tiupan kencang (knot)</label><input type="number" id="gust" value="${g}" min="0"></div>
<div><label>Tekanan (hPa)</label><input type="number" id="pr" value="${st.pr}"></div><div><label>Trend tekanan</label><select id="tr"><option value="u">Naik</option><option value="s">Stabil</option><option value="d">Turun perlahan</option><option value="dd">Turun mendadak</option></select></div></div>
<label style="margin-top:10px"><input type="checkbox" id="ts" style="width:auto" ${st.ts?"checked":""}> Ada amaran ribut petir</label></div>
<div class="c" style="border-color:${v[1]}"><div class="big" style="color:${v[1]}">${v[0]}</div><p>${v[2]}</p><div class="mut">Musim Monsun Timur Laut (Nov–Mac): cuaca pantai boleh berubah mendadak.</div></div>`}
const FS=[
{n:"Siakap",h:"Muara, jeti, tiang jambatan, tebing berlumpur",s:[3,3,1,1],sp:1,dd:1,um:"Udang hidup, ikan kecil hidup, atau lure (minnow, soft plastic)",tk:["Joran 7 kaki, medium-heavy","Reel spinning 3000–4000","Tali PE 2–3 atau mono 15–20 lb","Leader fluorocarbon 20–30 lb","Kail 2/0–4/0"],tp:"Suka masuk bawah tiang. Tahan drag lebih rapat."},
{n:"Jenahak",h:"Tunggul, batu, rumpai, dasar keras",s:[3,1,3,0],sp:1,dd:0,um:"Udang, sotong, ikan dipotong",tk:["Joran 6–7 kaki, medium","Reel spinning 3000–4000","Tali mono 15–20 lb","Leader 25–30 lb","Kail circle 2/0–3/0, sinker gelongsor"],tp:"Naikkan umpan sedikit dari dasar supaya tak tersangkut."},
{n:"Ikan duri (keli laut)",h:"Dasar berlumpur, muara keruh",s:[2,2,3,1],sp:1,dd:0,um:"Udang, ikan kecil, sotong",tk:["Joran 6–7 kaki, medium-heavy","Reel 4000","Tali 20–30 lb","Leader 30 lb","Kail 2/0–4/0, sinker 1–3 oz"],tp:"Duri sirip menyengat dan sakit. Guna pemegang ikan dan berhati-hati."},
{n:"Kerapu",h:"Tukun, batu karang, bangkai kapal, kawasan dalam",s:[1,2,1,3],sp:0,dd:0,um:"Ikan hidup, sotong, ikan dipotong",tk:["Joran 7 kaki, heavy","Reel 5000–6000","Tali 30–50 lb","Leader 50–80 lb","Kail 5/0–7/0, sinker 3–6 oz"],tp:"Tarik cepat sebaik kena supaya tak masuk lubang."},
{n:"Tenggiri",h:"Laut terbuka, tepi arus, sekitar tukun",s:[3,3,1,1],sp:0,dd:1,um:"Ikan hidup (tamban), spoon atau metal jig",tk:["Joran 7–8 kaki, medium-heavy","Reel 4000–5000","Tali PE 3–4","Leader wayar atau fluorocarbon 40 lb","Kail 3/0–5/0"],tp:"Gigi tajam: guna leader wayar."},
{n:"Selar / kembung",h:"Sekitar jeti, rumpon, air bersih",s:[3,2,2,1],sp:0,dd:1,um:"Sabiki, udang kecil",tk:["Joran 6 kaki, light","Reel 2000–2500","Tali 6–10 lb","Sabiki atau kail saiz 6–10","Sinker kecil"],tp:"Sesuai untuk permulaan, boleh jadi umpan hidup."}];
function fishView(){const p=P[st.port],d0=dayStart(st.day),ms=st.day==0?Date.now():d0+252e5,sl=H(ms+9e5)-H(ms-9e5),rate=Math.abs(sl)/.5/(2*Math.PI/12.42*(p.a+p.s)),k=kind(age(ms))[0];
let i,nm;if(rate<.2){i=H(ms)>p.m?2:3;nm=i==2?"Air mati (sekitar pasang penuh)":"Air mati (sekitar surut penuh)"}else if(sl>0){i=0;nm="Air naik"}else{i=1;nm="Air turun"}
const dt=new Date(ms),hr=dt.getHours()+dt.getMinutes()/60,dw=(hr>5.5&&hr<8.5)||(hr>17.5&&hr<20);
const lv=LV.cur!=null?(LV.cur>1.5?2:LV.cur>.5?1:0):(rate>.7?2:rate>.35?1:0),sk=["Sinker ringan (½–1 oz)","Sinker sederhana (1–2 oz)","Sinker berat (2–4 oz), arus kuat"][lv];
const L=FS.map(f=>({f,v:f.s[i]+(f.sp&&(k=="Pasang Besar"||k=="Menyorong Besar")?1:0)+(f.dd&&dw?1:0)})).sort((a,b)=>b.v-a.v);
const lb=v=>v>=4?["Sangat sesuai","var(--ok)"]:v>=3?["Sesuai","var(--ok)"]:v>=2?["Sederhana","var(--wn)"]:["Kurang sesuai","var(--bd)"];
const est=rate*1.8,cu=Math.max(LV.cur||0,est),src=LV.cur!=null&&LV.cur>=est?"data langsung":"anggaran daripada pasang surut";
const dp=+st.dp||5,mul=Math.min(1.6,1+dp/20),bs=cu<.5?[15,30]:cu<1?[30,60]:cu<1.5?[60,90]:cu<2.5?[90,150]:[150,250];
const lg=k=>{const x=Math.round(bs[0]*mul*k/5)*5,y=Math.round(bs[1]*mul*k/5)*5;return`<b>${x}–${y} g</b> (${(x/28.35).toFixed(1)}–${(y/28.35).toFixed(1)} oz)`};
const jn=cu<.5?"ladung bulat atau gelongsor":cu<1.5?"ladung bulat atau pyramid":"ladung pyramid atau berkuku (grapnel)";
const ladung=`<div class="c"><b>Panduan ladung</b><div class="mut">Arus ${cu.toFixed(1)} knot (${src})</div><div class="row" style="margin:8px 0"><label style="margin:0">Kedalaman (m)</label><input id="dp" type="number" value="${dp}" style="width:90px"></div><ul><li>Siakap, jenahak, ikan duri: ${lg(1)}</li><li>Kerapu: ${lg(1.3)}</li></ul><p>Jenis: ${jn}.</p><p class="mut">Panduan kasar. Kalau ladung tak duduk di dasar dan tali hanyut, naikkan sehingga ia duduk. Selar/kembung dan tenggiri tak perlu ladung berat: guna 10–30 g atau tanpa ladung. Arus dalam muara biasanya lebih kuat daripada data model.</p></div>`;
const bad=st.ts||+st.gust>=25||+st.wind>=20;
return`<div class="c"><div class="row"><b>${nm}</b><span class="mut">${st.day==0?"sekarang":"07:00"}</span></div><div class="mut">${k}${dw?" · waktu subuh/senja":""}</div>${bad?`<p style="color:var(--bd);font-weight:700">Cuaca berbahaya: jangan turun ke laut.</p>`:""}</div>
${ladung}<div class="c"><b>Ikan yang sesuai sekarang</b>`+L.map((x,j)=>{const g=lb(x.v),f=x.f;return`<details ${j==0?"open":""}><summary>${f.n} <span class="pill" style="background:${g[1]}">${g[0]}</span></summary><div class="mut">${f.h}</div><p><b>Umpan:</b> ${f.um}</p><b>Tackle</b><ul>${f.tk.map(t=>`<li>${t}</li>`).join("")}</ul><p class="mut">${f.tp}</p></details>`}).join("")+`</div><div class="c mut">Panduan umum, bukan jaminan. Spesies dan lokasi sebenar bergantung pada tempat anda. Semak peraturan Jabatan Perikanan untuk saiz dan kawasan larangan.</div>`}
let J=[];try{J=JSON.parse(localStorage.getItem("twj")||"[]")}catch(e){}
const sj=()=>{try{localStorage.setItem("twj",JSON.stringify(J))}catch(e){}};
const SPOT=["Jeti Batu Hampar (Jugra)","Sungai Selangor (Kuala Selangor)","Sabak Bernam","Jeti Teluk Nipah (Pulau Indah)"];
function tst(ms){const p=P[st.port],sl=H(ms+9e5)-H(ms-9e5),rate=Math.abs(sl)/.5/(2*Math.PI/12.42*(p.a+p.s));return rate<.2?(H(ms)>p.m?"Air mati (pasang penuh)":"Air mati (surut penuh)"):sl>0?"Air naik":"Air turun"}
function jurView(){const c={};J.forEach(x=>c[x.s]=(c[x.s]||0)+1);const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
return`<div class="c"><b>Cari spot sedia ada</b><p class="mut">Guna data sedia ada, bukan data yang awak kumpul sendiri.</p><a class="btn g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/spot+memancing+jeti">Spot memancing berhampiran (Google Maps)</a><a class="btn g" target="_blank" rel="noopener" href="https://fishbox.com/spot/malaysia">Senarai 1000+ spot (Fishbox)</a></div><div class="c"><b>Catat tangkapan</b><div class="grid" style="margin-top:8px"><div><label>Tempat</label><input id="jt" list="sp"><datalist id="sp">${SPOT.map(x=>`<option value="${x}">`).join("")}</datalist></div><div><label>Ikan</label><select id="ji">${FS.map(f=>`<option>${f.n}</option>`).join("")}<option>Lain-lain</option></select></div><div><label>Berat (kg)</label><input id="jb" type="number" step="0.1"></div><div><label>Umpan</label><input id="ju"></div></div><button class="btn g" id="js">Simpan</button><div class="mut" style="margin-top:6px">Masa, keadaan air dan fasa bulan direkod automatik.</div></div>
<div class="c"><b>Rekod anda (${J.length})</b>`+(top?`<p class="mut">Paling banyak dapat ikan semasa: ${top[0]} (${top[1]} kali)</p>`:`<p class="mut">Belum ada rekod. Catat tangkapan pertama anda di atas.</p>`)+J.slice().reverse().map(x=>`<details><summary>${x.i} · ${x.t||"-"}</summary><div class="mut">${new Date(x.m).toLocaleString("ms-MY")} · ${x.s} · ${x.k}</div><div>${x.b?x.b+" kg · ":""}${x.u||""}</div><button data-jd="${x.m}" style="margin-top:6px;font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--bd);border-radius:8px;padding:5px 10px">Padam</button></details>`).join("")+`</div><div class="c mut">Rekod disimpan dalam fon ini sahaja. Jika anda padam data pelayar atau buang app, rekod hilang.</div>`}
function sosView(){return`<div class="c"><b>Kecemasan di laut</b><p class="mut">Bot terbalik, enjin rosak atau kecemasan kesihatan: hubungi 999 (MERS) dahulu atau gunakan radio VHF Channel 16 jika ada.</p>
<a class="btn" href="tel:999">Telefon 999</a><button class="btn g" id="loc">Hantar lokasi ke WhatsApp</button><div class="mut" id="ls" style="margin-top:8px"></div></div>
<div class="c mut">Butang ini bantu berkongsi lokasi dengan waris atau rakan. Ia bukan pengganti perkhidmatan menyelamat rasmi dan bergantung pada liputan isyarat telefon.</div>`}
function render(){const T=[["t","Pasang"],["w","Angin"],["f","Ikan"],["j","Jurnal"],["s","SOS"]];
$("tabs").innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${st.tab==t[0]?"on":""} ${t[0]=="s"?"sos":""}">${t[1]}</button>`).join("");
$("v").innerHTML=st.tab=="t"?tideView():st.tab=="w"?windView():st.tab=="f"?fishView():st.tab=="j"?jurView():sosView();
if(st.tab=="w"){$("tr").value=st.tr;["wind","gust","pr","tr","ts"].forEach(id=>$(id).onchange=e=>{st[id]=id=="ts"?e.target.checked:id=="tr"?e.target.value:+e.target.value;save();render()})}
if($("rf"))$("rf").onclick=live;
if($("dp"))$("dp").onchange=e=>{st.dp=+e.target.value||5;render()};
if($("os"))$("os").onclick=()=>{try{localStorage.setItem("twt_"+st.port,$("ot").value)}catch(e){}loadOF();render()};
if($("js"))$("js").onclick=()=>{const m=Date.now();J.push({m,t:$("jt").value,i:$("ji").value,b:$("jb").value,u:$("ju").value,s:tst(m),k:kind(age(m))[0]});sj();render()};
if(st.tab=="s")$("loc").onclick=()=>{const s=$("ls");s.textContent="Mencari lokasi...";navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{window.open("https://wa.me/?text="+encodeURIComponent("Saya perlukan bantuan. Lokasi saya: https://maps.google.com/?q="+p.coords.latitude+","+p.coords.longitude),"_blank");s.textContent="Lokasi sedia dihantar."},()=>{s.textContent="Lokasi tidak dapat diakses. Benarkan akses lokasi dalam tetapan."}):s.textContent="Peranti tidak menyokong lokasi."}}
$("port").innerHTML=Object.keys(P).map(k=>`<option value="${k}">${P[k].n}</option>`).join("");$("port").value=st.port;
$("port").onchange=e=>{st.port=e.target.value;save();render();live()};
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t){st.tab=b.dataset.t;render()}if(b.dataset.d){st.day+=+b.dataset.d;render()}if(b.dataset.jd){J=J.filter(x=>x.m!=b.dataset.jd);sj();render()}});
render();live();setInterval(live,6e5);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
