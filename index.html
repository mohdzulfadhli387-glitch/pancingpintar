<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pancing Pintar</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#061a2e" />
  <style>
    :root {
      --bg: #071a2b;
      --bg2: #0d2339;
      --card: rgba(16, 32, 48, 0.88);
      --card2: rgba(15, 48, 60, 0.9);
      --line: rgba(172, 205, 220, 0.18);
      --text: #ebf4fb;
      --muted: #9bb6c7;
      --blue: #35b7ff;
      --cyan: #4edec3;
      --green: #42d492;
      --amber: #f1c76a;
      --red: #ff6d7a;
      --purple: #9e7dff;
      --shadow: rgba(0,0,0,0.28);
      --danger: #ff5b5b;
      --warning: #ffbb55;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at top, rgba(50,142,200,0.22), transparent 38%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 14px 40px;
      min-height: 100vh;
    }

    .app {
      background: rgba(10,22,34,0.95);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 40px var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(12, 28, 40, 0.7);
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .status {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(66,212,146,.9);
    }

    .section {
      padding: 14px 14px 6px;
    }

    select, input, button {
      font: inherit;
    }

    select {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(21, 38, 54, 0.78);
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .tab {
      padding: 9px 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(20, 35, 48, 0.8);
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(53,183,255,0.28), rgba(78,222,195,0.25));
      color: var(--text);
      border-color: rgba(53,183,255,0.45);
      box-shadow: inset 0 0 0 1px rgba(53,183,255,0.3);
    }

    .tab.red { border-color: rgba(255,109,122,0.5); }
    .tab.red.active { background: linear-gradient(135deg, rgba(255,109,122,0.22), rgba(255,109,122,0.18)); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .big {
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1.05;
      margin: 6px 0;
    }

    .score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      color: #09321b;
      background: linear-gradient(135deg, var(--green), #8ae6b0);
      min-width: 84px;
    }

    .score.warn {
      background: linear-gradient(135deg, var(--amber), #ffd89b);
      color: #2a1800;
    }

    .score.bad {
      background: linear-gradient(135deg, var(--red), #ff9aa5);
      color: #270810;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .mini {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 10px 8px;
    }

    .mini strong {
      display: block;
      font-size: 1.15rem;
      margin-top: 2px;
    }

    .bar {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
      margin-top: 10px;
    }

    .bar span {
      display: block;
      height: 14px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .bar span.fill {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border-color: rgba(53,183,255,0.32);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 0.78rem;
    }

    .fish-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .fish-item {
      padding: 12px 12px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--line);
    }

    .fish-name {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .fish-tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      background: rgba(66,212,146,0.18);
      color: var(--green);
      border: 1px solid rgba(66,212,146,0.25);
    }

    .fish-desc {
      color: var(--muted);
      font-size: 0.79rem;
      line-height: 1.5;
    }

    .spot-grid {
      display: grid;
      gap: 10px;
    }

    .spot-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.025);
    }

    .spot-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .spot-head strong {
      font-size: 1rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      background: rgba(53,183,255,0.14);
      color: var(--blue);
      border: 1px solid rgba(53,183,255,0.28);
    }

    .danger {
      color: var(--danger);
      font-weight: 700;
    }

    .warn {
      color: var(--warning);
      font-weight: 700;
    }

    .good {
      color: var(--green);
      font-weight: 700;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .summary-line {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .footer-note {
      padding: 0 14px 16px;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .tabs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Pancing Pintar</div>
      <div class="status">
        <span class="dot"></span>
        <span>Data anggaran</span>
      </div>
    </div>

    <div class="section">
      <select id="stationSelect"></select>

      <div class="tabs" id="tabs"></div>
    </div>

    <div id="content" class="section"></div>

    <div class="footer-note">
      Nota: alat ini membekalkan anggaran berdasarkan pasang surut, angin, cuaca dan trend tempatan. Untuk keselamatan dan navigasi, rujuk sumber rasmi seperti JUPEM, MetMalaysia dan Jabatan Laut Malaysia.
    </div>
  </div>

  <script>
    const stations = {
      klang: { name: 'Pelabuhan Klang', region: 'Selangor', lat: 3.05, lon: 101.35, range: 2.4, vibe: 'Batu & jeti' },
      tanjungKeling: { name: 'Tanjung Keling', region: 'Melaka', lat: 2.20, lon: 102.15, range: 2.2, vibe: 'Pantai & muara' },
      kualaSelangor: { name: 'Kuala Selangor', region: 'Selangor', lat: 3.34, lon: 101.25, range: 2.1, vibe: 'Muara & estuari' },
      pulauPinang: { name: 'Pulau Pinang', region: 'Pulau Pinang', lat: 5.42, lon: 100.33, range: 2.8, vibe: 'Batu & jeti' },
      langkawi: { name: 'Langkawi', region: 'Kedah', lat: 6.35, lon: 99.80, range: 2.6, vibe: 'Batu & laut terbuka' },
      kuantan: { name: 'Kuantan', region: 'Pahang', lat: 3.82, lon: 103.33, range: 2.7, vibe: 'Pantai & batu' },
      geting: { name: 'Geting', region: 'Kelantan', lat: 5.88, lon: 102.52, range: 2.3, vibe: 'Pantai & sebelah muara' },
      johorBahru: { name: 'Johor Bahru', region: 'Johor', lat: 1.46, lon: 103.75, range: 2.5, vibe: 'Jeti & karang' },
      kotaKinabalu: { name: 'Kota Kinabalu', region: 'Sabah', lat: 5.98, lon: 116.08, range: 2.9, vibe: 'Laut & karang' },
      sandakan: { name: 'Sandakan', region: 'Sabah', lat: 5.84, lon: 118.12, range: 2.7, vibe: 'Batu & muara' },
      tawau: { name: 'Tawau', region: 'Sabah', lat: 4.25, lon: 117.89, range: 2.8, vibe: 'Laut terbuka & batu' },
      miri: { name: 'Miri', region: 'Sarawak', lat: 4.40, lon: 113.99, range: 2.6, vibe: 'Batu & dangkal' }
    };

    const fishProfiles = [
      { name: 'Kerapu', habitat: 'Batu karang & tukun', best: 'Air bergerak sederhana, pasang masuk', setup: 'Bottom rig, pancing berat, umpan hidup', score: 'Sangat sesuai' },
      { name: 'Jenahak', habitat: 'Kawasan dasar keras & batu', best: 'Pasang menengah, air bersih', setup: 'Bottom fishing, sinker 2–4 oz', score: 'Sesuai' },
      { name: 'Siakap', habitat: 'Muara, jeti & tepi lumpur', best: 'Air pasang kecil, subuh/senja', setup: 'Soft plastic / live bait', score: 'Sangat sesuai' },
      { name: 'Selar', habitat: 'Jeti & around bait ball', best: 'Waktu subuh & senja', setup: 'Sabiki / mini jig', score: 'Sesuai' },
      { name: 'Senangin', habitat: 'Muara & kawasan arus', best: 'Air naik & arus sederhana', setup: 'Pancing dasar, umpan hidup', score: 'Sederhana' },
      { name: 'Tenggiri', habitat: 'Laut terbuka & tepi arus', best: 'Air bergerak & ombak sederhana', setup: 'Trolling / spoon / jig', score: 'Sesuai' }
    ];

    const state = {
      station: 'klang',
      tab: 'tide',
      dayOffset: 0,
      wind: 8,
      gust: 12,
      pressure: 1014,
      trend: 'stable'
    };

    const tabs = [
      { key: 'tide', label: 'Pasang' },
      { key: 'wind', label: 'Cuaca' },
      { key: 'fish', label: 'Ikan' },
      { key: 'spot', label: 'Spot' },
      { key: 'log', label: 'Jurnal' },
      { key: 'sos', label: 'SOS', red: true }
    ];

    function toTitleCase(str) {
      return str.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase()).trim();
    }

    function stationOptions() {
      const select = document.getElementById('stationSelect');
      select.innerHTML = Object.entries(stations)
        .map(([k, s]) => `<option value="${k}">${s.name} · ${s.region}</option>`)
        .join('');
      select.value = state.station;
      select.addEventListener('change', (e) => {
        state.station = e.target.value;
        render();
      });
    }

    function renderTabs() {
      const host = document.getElementById('tabs');
      host.innerHTML = tabs.map(tab => `
        <button class="tab ${state.tab === tab.key ? 'active' : ''} ${tab.red ? 'red' : ''}" data-tab="${tab.key}">${tab.label}</button>
      `).join('');

      host.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
          state.tab = btn.dataset.tab;
          render();
        });
      });
    }

    function getDayStart(offset = 0) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + offset);
      return d;
    }

    function phaseFromDate(date) {
      const synodic = 29.530588;
      const known = Date.UTC(2000, 0, 6, 18, 14);
      const diff = (date.getTime() - known) / 86400000;
      const phase = ((diff % synodic) + synodic) % synodic;
      return (phase / synodic) * 100;
    }

    function moonGlyph(value) {
      const phases = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
      return phases[Math.round((value / 100) * 7) % 8];
    }

    function getTideAt(date, stationKey) {
      const station = stations[stationKey];
      const base = 1.8 + station.range * 0.6;
      const hours = (date.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 3600000;
      const waveA = 0.80 * Math.cos((hours * 0.360) * (Math.PI / 180));
      const waveB = 0.55 * Math.cos((hours * 0.520) * (Math.PI / 180));
      const waveC = 0.30 * Math.cos((hours * 0.170) * (Math.PI / 180));
      return base + waveA + waveB + waveC;
    }

    function tideStateLabel(value) {
      if (value > 2.4) return { label: 'Pasang besar', tone: 'bad' };
      if (value > 1.8) return { label: 'Pasang masuk', tone: 'warn' };
      if (value > 1.2) return { label: 'Air senang', tone: 'good' };
      return { label: 'Surut kecil', tone: 'warn' };
    }

    function renderTideView() {
      const station = stations[state.station];
      const date = getDayStart(state.dayOffset);
      const now = new Date();
      const currentTide = getTideAt(now, state.station);
      const phasePct = phaseFromDate(now);
      const stateLabel = tideStateLabel(currentTide);

      const nextHours = Array.from({ length: 5 }, (_, i) => {
        const d = new Date(Date.now() + i * 3600000 * 3);
        const value = getTideAt(d, state.station);
        const tag = tideStateLabel(value);
        return `<div class="mini"><div class="muted">${d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })}</div><strong>${value.toFixed(1)}m</strong><div class="muted">${tag.label}</div></div>`;
      }).join('');

      const bars = Array.from({ length: 10 }, (_, i) => {
        const fill = i < 6 ? 'fill' : '';
        return `<span class="${fill}"></span>`;
      }).join('');

      const summary = `
        <div class="card">
          <div class="row">
            <div>
              <div class="muted">Stesen ${station.name}</div>
              <div class="big">${currentTide.toFixed(1)}m</div>
            </div>
            <div class="score ${stateLabel.tone === 'bad' ? 'bad' : stateLabel.tone === 'warn' ? 'warn' : ''}">${stateLabel.label}</div>
          </div>
          <div class="summary-line">${moonGlyph(phasePct)} Fasa bulan: ${Math.round(phasePct)}% · Lokasi: ${station.region}</div>
          <div class="bar">${bars}</div>
          <div class="chips">
            <span class="chip">Masa: ${now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })}</span>
            <span class="chip">Arus: ${station.vibe}</span>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <strong>Jangka 12 jam</strong>
            <span class="muted">${station.name}</span>
          </div>
          <div class="mini-grid">${nextHours}</div>
        </div>
      `;

      document.getElementById('content').innerHTML = summary;
    }

    function getWindStatus() {
      const w = Number(state.wind);
      const g = Number(state.gust);
      if (g >= 25 || w >= 20) return { label: 'Bahaya', tone: 'bad', msg: 'Angin kuat dan ombak berpotensi tinggi. Elakkan laut terbuka.' };
      if (w >= 15 || g >= 18) return { label: 'Berhati-hati', tone: 'warn', msg: 'Bot kecil perlu pantau cuaca dan elakkan kawasan terbuka.' };
      return { label: 'Sederhana', tone: 'good', msg: 'Cuaca masih boleh diterima untuk aktiviti laut dengan pemantauan.' };
    }

    function renderWindView() {
      const status = getWindStatus();
      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="row">
            <div>
              <div class="muted">Keadaan laut</div>
              <div class="big">${state.wind} kn</div>
            </div>
            <div class="score ${status.tone === 'bad' ? 'bad' : status.tone === 'warn' ? 'warn' : ''}">${status.label}</div>
          </div>
          <div class="summary-line">Pecutan angin: ${state.gust} kn · Tekanan: ${state.pressure} hPa</div>
          <div class="mini-grid">
            <div class="mini"><div class="muted">Angin</div><strong>${state.wind} knot</strong></div>
            <div class="mini"><div class="muted">Pusuan</div><strong>${state.gust} knot</strong></div>
            <div class="mini"><div class="muted">Tekanan</div><strong>${state.pressure} hPa</strong></div>
            <div class="mini"><div class="muted">Trend</div><strong>${state.trend === 'up' ? 'Naik' : state.trend === 'down' ? 'Turun' : 'Stabil'}</strong></div>
          </div>
          <div class="summary-line">${status.msg}</div>
        </div>

        <div class="card">
          <div class="row">
            <strong>Input cepat</strong>
          </div>
          <div class="mini-grid">
            <div class="mini"><label class="muted">Angin (kn)</label><input id="windInput" type="number" value="${state.wind}" /></div>
            <div class="mini"><label class="muted">Pusuan (kn)</label><input id="gustInput" type="number" value="${state.gust}" /></div>
            <div class="mini"><label class="muted">Tekanan</label><input id="pressureInput" type="number" value="${state.pressure}" /></div>
            <div class="mini"><label class="muted">Trend</label>
              <select id="trendInput">
                <option value="stable" ${state.trend === 'stable' ? 'selected' : ''}>Stabil</option>
                <option value="up" ${state.trend === 'up' ? 'selected' : ''}>Naik</option>
                <option value="down" ${state.trend === 'down' ? 'selected' : ''}>Turun</option>
              </select>
            </div>
          </div>
        </div>
      `;

      const windInput = document.getElementById('windInput');
      const gustInput = document.getElementById('gustInput');
      const pressureInput = document.getElementById('pressureInput');
      const trendInput = document.getElementById('trendInput');

      windInput.addEventListener('input', e => { state.wind = Number(e.target.value) || 0; render(); });
      gustInput.addEventListener('input', e => { state.gust = Number(e.target.value) || 0; render(); });
      pressureInput.addEventListener('input', e => { state.pressure = Number(e.target.value) || 1014; render(); });
      trendInput.addEventListener('change', e => { state.trend = e.target.value; render(); });
    }

    function fishActivityScore() {
      const base = 50 + ((state.wind < 12 ? 10 : 0) + (state.gust < 18 ? 8 : 0) + ((state.pressure > 1008 && state.pressure < 1018) ? 12 : 0));
      const stationFactor = stations[state.station].range;
      const score = Math.max(20, Math.min(95, Math.round(base + stationFactor * 8 - (state.wind * 1.8) - (state.gust * 1.2))));
      if (score >= 75) return { label: 'Tinggi', tone: 'good', score };
      if (score >= 50) return { label: 'Sederhana', tone: 'warn', score };
      return { label: 'Rendah', tone: 'bad', score };
    }

    function renderFishView() {
      const activity = fishActivityScore();
      const top = fishProfiles.slice(0, 4).map(fish => {
        const hit = fish.name === 'Kerapu' || fish.name === 'Jenahak' ? 'Sesuai' : 'Boleh cuba';
        return `
          <div class="fish-item">
            <div class="fish-name">
              <span>${fish.name}</span>
              <span class="fish-tag">${hit}</span>
            </div>
            <div class="fish-desc">Habitat: ${fish.habitat}</div>
            <div class="fish-desc">Kondisi terbaik: ${fish.best}</div>
            <div class="fish-desc">Setup: ${fish.setup}</div>
          </div>
        `;
      }).join('');

      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="row">
            <div>
              <div class="muted">Aktiviti ikan</div>
              <div class="big">${activity.label}</div>
            </div>
            <div class="score ${activity.tone === 'bad' ? 'bad' : activity.tone === 'warn' ? 'warn' : ''}">${activity.score}/100</div>
          </div>
          <div class="summary-line">Anggaran berasaskan pasang surut, arus, ombak, angin dan jenis habitat di ${stations[state.station].name}.</div>
        </div>

        <div class="card">
          <div class="row"><strong>Spesies berpotensi</strong></div>
          <div class="fish-list">${top}</div>
        </div>
      `;
    }

    function renderSpotView() {
      const spots = [
        { name: 'Batu Ladung Pelabuhan Klang', type: 'Batu & jeti', tag: 'Tinggi', summary: 'Cocok untuk bottom fishing dan jig, terutama ketika air bergerak secara sederhana.', danger: 'Elakkan ketika angin melebihi 20 knot.' },
        { name: 'Muara Kuala Selangor', type: 'Muara', tag: 'Sederhana', summary: 'Kawasan baik untuk siakap, senangin dan baitfish, lebih aktif bila air pasang kecil.', danger: 'Awas arus dan lumpur.' },
        { name: 'Karang Tanjung Keling', type: 'Karang & pantai', tag: 'Sesuai', summary: 'Kerapu dan jenahak kerap muncul ketika pasang masuk dengan arus lembut.', danger: 'Pantau ombak sebelum masuk ke karang.' },
        { name: 'Jeti Pulau Pinang', type: 'Jeti', tag: 'Tinggi', summary: 'Lokasi ideal untuk selar, siakap dan pancing sekitar struktur jeti.', danger: 'Pastikan cuaca dan arus selamat.' }
      ];

      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="row">
            <strong>Spot memancing</strong>
            <span class="badge">${stations[state.station].name}</span>
          </div>
          <div class="summary-line">Senarai ini adalah panduan lokasi dan jenis struktur yang sering dikaitkan dengan hasil ikan.</div>
        </div>

        <div class="spot-grid">
          ${spots.map(spot => `
            <div class="spot-item">
              <div class="spot-head">
                <strong>${spot.name}</strong>
                <span class="badge">${spot.tag}</span>
              </div>
              <div class="muted">Jenis: ${spot.type}</div>
              <div class="summary-line">${spot.summary}</div>
              <div class="summary-line ${spot.danger.includes('Elakkan') ? 'danger' : spot.danger.includes('Awas') ? 'warn' : 'good'}">${spot.danger}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderLogView() {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="row">
            <strong>Jurnal memancing</strong>
            <span class="badge">Rekod peribadi</span>
          </div>
          <div class="summary-line">Fungsi ini sesuai untuk mengingat lokasi, jenis umpan, weather, masa dan keadaan air. Rekod ini berfungsi sebagai rujukan sendiri.</div>
          <div class="mini-grid">
            <div class="mini"><label class="muted">Tarikh</label><input type="date" /></div>
            <div class="mini"><label class="muted">Lokasi</label><input type="text" placeholder="Contoh: Batu Ladung Klang" /></div>
            <div class="mini"><label class="muted">Jenis ikan</label><input type="text" placeholder="Contoh: Kerapu" /></div>
            <div class="mini"><label class="muted">Umpan</label><input type="text" placeholder="Contoh: Sotong hidup" /></div>
          </div>
        </div>
      `;
    }

    function renderSosView() {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="row">
            <strong>Keselamatan laut</strong>
            <span class="badge">SOS</span>
          </div>
          <div class="summary-line">Jika kecemasan, hubungi 999 dahulu. Jika anda mempunyai radio VHF, gunakan saluran 16. Pastikan anda mendapat bantuan yang sesuai dan maklumkan lokasi dengan jelas.</div>
          <div class="mini-grid">
            <div class="mini"><div class="muted">Kecemasan</div><strong class="danger">999</strong></div>
            <div class="mini"><div class="muted">Awas angin</div><strong>${state.wind} kn</strong></div>
            <div class="mini"><div class="muted">Cuaca</div><strong>${state.gust >= 20 ? 'Berbahaya' : 'Sederhana'}</strong></div>
            <div class="mini"><div class="muted">Status</div><strong>${getWindStatus().label}</strong></div>
          </div>
        </div>
      `;
    }

    function render() {
      stationOptions();
      renderTabs();

      if (state.tab === 'tide') renderTideView();
      else if (state.tab === 'wind') renderWindView();
      else if (state.tab === 'fish') renderFishView();
      else if (state.tab === 'spot') renderSpotView();
      else if (state.tab === 'log') renderLogView();
      else renderSosView();
    }

    document.addEventListener('DOMContentLoaded', () => {
      stationOptions();
      renderTabs();
      render();
    });
  </script>
</body>
</html>
